<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gegenpress — Studio</title>
<style>
  /* Archivo: one grotesque with a WIDTH axis as well as weight, so the
     whole package is a single typeface differentiated by width -- wide
     figures, narrow names. Self-hosted: the demo must not depend on a
     font CDN being up. */
  @font-face{
    font-family:'Archivo Variable';font-style:normal;font-display:block;
    font-weight:100 900;font-stretch:62% 125%;
    src:url(fonts/archivo-latin-wdth-normal.woff2) format('woff2-variations');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
      U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
      U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Archivo Variable';font-style:normal;font-display:block;
    font-weight:100 900;font-stretch:62% 125%;
    src:url(fonts/archivo-latin-ext-wdth-normal.woff2) format('woff2-variations');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
      U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,
      U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }

  :root{
    /* Premier League purple family. The chrome reads as near-black but
       is unmistakably warm; the league's own signal colours carry the
       claim. Nothing else on screen is allowed to be coloured. */
    --ink0:#0B0010; --ink1:#1C0423; --ink2:#2A0733; --ink3:#3A0F46;
    --rule:#471A54; --pl:#37003C;
    --up:#00FF85; --down:#E90052; --data:#04F5FF;
    --white:#fff; --soft:#C9B4D3; --dim:#8A6E97;
    --home:#5aa9ff; --away:#ecA322;
    --f:'Archivo Variable',system-ui,sans-serif;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  /* The width axis is the signature. Weight alone is what everyone
     else varies, which is why everyone else looks the same. */
  .fig  {font-variation-settings:'wght' 800,'wdth' 118;letter-spacing:-.025em;
         font-feature-settings:'tnum' 1}
  .name {font-variation-settings:'wght' 650,'wdth' 80}
  .meta {font-variation-settings:'wght' 450,'wdth' 88}
  .micro{font-variation-settings:'wght' 700,'wdth' 74;
         text-transform:uppercase;letter-spacing:.075em}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink0);color:var(--white);overflow:hidden;
    font:15px/1.5 var(--f);font-variation-settings:'wght' 400,'wdth' 100;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ----------
     No rounded corners, no backdrop blur, no 1px translucent borders, no
     drop shadows. Those are the dashboard dialect every entry in this
     field speaks, and they are also the broadcast era that current
     practice has moved on from: strip the decoration, let the game
     breathe, let type carry it. Every panel here is an opaque plane
     flush to an edge, divided by solid hairlines. */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column}
  .field{position:relative;flex:1;min-height:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 56%,transparent 58%,rgba(8,0,14,.5) 100%)}
  .grain{position:absolute;inset:-130px;pointer-events:none;z-index:1;
    background-repeat:repeat;animation:gr .9s steps(1) infinite}
  @keyframes gr{
    0%{transform:translate(0,0)}      14%{transform:translate(-47px,31px)}
    28%{transform:translate(23px,-59px)} 42%{transform:translate(-71px,-13px)}
    56%{transform:translate(53px,41px)}  70%{transform:translate(-19px,-83px)}
    84%{transform:translate(37px,7px)}   100%{transform:translate(0,0)}
  }

  /* ---------- scorebug: flush to the corner, not floating ---------- */
  .bug{position:absolute;top:0;left:0;display:flex;align-items:stretch;
    background:var(--ink1);z-index:3}
  .bug .mark{display:flex;align-items:center;background:var(--up);color:var(--pl);
    padding:0 13px;font:13px/1 var(--f);
    font-variation-settings:'wght' 800,'wdth' 74;letter-spacing:.1em}
  .bug .side{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .bug .tag{font:12px/1 var(--f);font-variation-settings:'wght' 750,'wdth' 74;
    letter-spacing:.09em}
  .bug .h .tag{color:var(--home)} .bug .a .tag{color:var(--away)}
  .bug .g{font:23px/1 var(--f);font-variation-settings:'wght' 800,'wdth' 118;
    font-feature-settings:'tnum' 1}
  .bug .clk{padding:13px 17px;border-left:1px solid var(--rule);
    font:15px/1 var(--f);font-variation-settings:'wght' 700,'wdth' 112;
    font-feature-settings:'tnum' 1;color:var(--data);min-width:64px;text-align:center}
  .bug .live{display:flex;align-items:center;gap:7px;padding:13px 15px;
    border-left:1px solid var(--rule);font:10px/1 var(--f);
    font-variation-settings:'wght' 750,'wdth' 74;letter-spacing:.13em;
    color:var(--down);opacity:.3;transition:opacity .3s}
  .bug .live.on{opacity:1}
  .bug .live i{width:6px;height:6px;background:var(--down)}
  .bug .live.on i{animation:beat 1.5s infinite}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.2}}

  /* ---------- lower third ----------
     Hierarchy first: the Form Line is the one thing this project exists
     to say, so it is read first and sized accordingly. The old layout
     put it last, in the least-read corner, at the same weight as two
     stats any competitor also shows. */
  .lower{position:absolute;left:0;right:0;bottom:0;z-index:3;
    display:flex;align-items:stretch;background:var(--ink1);
    transform:translateY(101%);transition:transform .45s var(--ease),right .35s var(--ease)}
  .lower.up{transform:none}
  .lower .band{width:6px;background:var(--up);flex:none}
  .lower.dn .band{background:var(--down)}

  .hero{flex:none;padding:14px 22px 13px;border-right:1px solid var(--rule);
    min-width:218px;background:var(--ink2)}
  .hero .k{font-size:9.5px;color:var(--up);margin-bottom:7px}
  .lower.dn .hero .k{color:var(--down)}
  .hero .v{font-size:38px;line-height:1;color:var(--up)}
  .lower.dn .hero .v{color:var(--down)}
  .hero .tag{font-size:9px;color:var(--soft);margin-top:9px;line-height:1.5}
  .hero .tag span{display:block;white-space:nowrap}

  .lower .body{flex:1 1 300px;min-width:0;padding:15px 22px}
  .ltop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .lname{font-size:21px;line-height:1.1}
  .lmeta{font-size:12.5px;color:var(--soft)}
  .lsaid{font-size:14.5px;color:#E8DCEE;margin-top:6px;max-width:68ch}

  .lnums{display:flex;flex:none}
  .ln{padding:15px 22px;min-width:132px;border-left:1px solid var(--rule)}
  .ln .k{font-size:9.5px;color:var(--dim);margin-bottom:8px}
  .ln .v{font-size:25px;line-height:1}
  .ln .s{font-size:11px;color:var(--soft);margin-top:6px}

  /* ---------- transport: labels and rules, not pills ---------- */
  .bar{display:flex;align-items:stretch;background:var(--ink1);
    border-top:1px solid var(--rule);flex:none}
  .btn{font:11.5px/1 var(--f);font-variation-settings:'wght' 700,'wdth' 74;
    text-transform:uppercase;letter-spacing:.085em;
    color:var(--soft);background:transparent;border:0;
    border-right:1px solid var(--rule);
    padding:14px 19px;cursor:pointer;transition:.14s var(--ease);white-space:nowrap}
  .btn:hover{color:var(--white);background:var(--ink2)}
  .btn.p,.btn[aria-pressed=true]{color:var(--pl);background:var(--up)}
  .bar .right{margin-left:auto;display:flex}
  .bar .right .btn{border-right:0;border-left:1px solid var(--rule)}
  .track{flex:1;min-width:60px;position:relative;cursor:pointer;
    background:var(--ink0);border-right:1px solid var(--rule)}
  .track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink3);
    transition:width .12s linear}
  .track .pip{position:absolute;top:50%;width:2px;height:13px;margin-top:-6px;
    background:var(--dim)}
  .track .pip.hit{background:var(--up)}

  /* ---------- rail: flush to the right edge, full height ---------- */
  .rail{position:absolute;top:0;right:0;bottom:0;width:clamp(232px,23vw,300px);
    z-index:2;background:var(--ink1);border-left:1px solid var(--rule);
    display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
    transition:transform .4s var(--ease)}
  .rail.off{transform:translateX(101%)}
  .rail::-webkit-scrollbar{width:0}
  body.analyst .lower{right:clamp(232px,23vw,300px)}
  .card{flex:none;border-bottom:1px solid var(--rule);min-height:0}
  .card>div{overflow-y:auto;overscroll-behavior:contain}
  .card>div::-webkit-scrollbar{width:0}
  /* Fade the cut rather than slicing a row in half, which reads as a
     rendering fault instead of "there is more below". */
  #timeline{max-height:38vh;
    mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent)}
  #follow{max-height:26vh}
  #signal{max-height:24vh}
  .card h2{font:9.5px/1 var(--f);font-variation-settings:'wght' 700,'wdth' 74;
    text-transform:uppercase;letter-spacing:.11em;color:var(--dim);
    padding:14px 16px;background:var(--ink2)}
  .row{display:block;width:100%;text-align:left;cursor:pointer;padding:10px 16px;
    border:0;border-top:1px solid var(--rule);background:transparent;color:inherit;
    font:inherit;opacity:.32;transition:.18s var(--ease)}
  .row.fired{opacity:1}
  .row:hover{background:var(--ink2)}
  .row[aria-current=true]{background:var(--ink3);box-shadow:inset 3px 0 0 var(--up)}
  .row .t{display:flex;align-items:baseline;gap:9px}
  .row .mn{font-size:10.5px;color:var(--dim);min-width:26px;
    font-variation-settings:'wght' 700,'wdth' 90;font-feature-settings:'tnum' 1}
  .row .nm{font-size:13px;font-variation-settings:'wght' 650,'wdth' 84}
  .row .dt{width:5px;height:5px;margin-left:auto}
  .row .mt{font-size:11px;color:var(--soft);padding-left:35px;margin-top:3px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:12.5px;
    border-top:1px solid var(--rule)}
  .item .r{font-size:10px;color:var(--dim);min-width:12px;
    font-variation-settings:'wght' 700,'wdth' 90}
  .item .v{margin-left:auto;font-size:11.5px;color:var(--data);
    font-variation-settings:'wght' 700,'wdth' 100;font-feature-settings:'tnum' 1}
  .item .yes{color:var(--up)} .item .no{color:var(--dim)}

  /* ---------- why sheet ---------- */
  .sheet{position:absolute;left:0;bottom:0;z-index:4;
    width:min(660px,calc(100% - clamp(232px,23vw,300px)));
    background:var(--ink1);border-top:1px solid var(--rule);
    border-right:1px solid var(--rule);padding:18px 22px;
    transform:translateY(101%);transition:transform .4s var(--ease)}
  .sheet.up{transform:none}
  .sheet h3{font:9.5px/1 var(--f);font-variation-settings:'wght' 700,'wdth' 74;
    text-transform:uppercase;letter-spacing:.11em;color:var(--dim);margin-bottom:13px}
  .step{display:flex;gap:12px;align-items:flex-start;font-size:13px;margin-bottom:8px}
  .step b{font-size:9.5px;line-height:1.75;color:var(--dim);min-width:68px;
    font-variation-settings:'wght' 700,'wdth' 74;
    text-transform:uppercase;letter-spacing:.075em;flex-shrink:0}
  .step span{color:var(--soft)}
  .step code{color:var(--white);font-family:var(--f);
    font-variation-settings:'wght' 650,'wdth' 100;font-feature-settings:'tnum' 1}
  .hide{display:none !important}

  /* Narrow viewports: the lower third used to squeeze its body to ~180px
     and wrap the tag into a blob. Shed the supporting figures instead --
     the claim and the Form Line are what must survive. */
  @media (max-width:1180px){
    .ln.league{display:none}
    .lsaid{font-size:13.5px}
  }
  @media (max-width:960px){
    .lnums{display:none}
    .hero{min-width:164px}
    .hero .v{font-size:32px}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="field">
    <canvas id="cv"></canvas>
    <div class="vig"></div>

    <div class="bug">
      <div class="mark">GP</div>
      <div class="side h"><span class="tag" id="hTag">—</span><span class="g" id="hG">0</span></div>
      <div class="side a"><span class="g" id="aG">0</span><span class="tag" id="aTag">—</span></div>
      <div class="clk" id="clk">0'</div>
      <div class="live" id="live"><i></i>LIVE</div>
    </div>

    <div class="lower" id="lower">
      <div class="band"></div>
      <div class="hero">
        <div class="k micro">Form line</div>
        <div class="v fig" id="lForm">—</div>
        <div class="tag micro" id="lTag"></div>
      </div>
      <div class="body">
        <div class="ltop">
          <span class="lname name" id="lName"></span>
          <span class="lmeta meta" id="lMeta"></span>
        </div>
        <div class="lsaid" id="lSaid"></div>
      </div>
      <div class="lnums" id="lNums"></div>
    </div>

    <div class="sheet" id="sheet"></div>

    <div class="rail" id="rail">
      <section class="card"><h2>Moments</h2><div id="timeline"></div></section>
      <section class="card"><h2>Follow — lift over own norm</h2><div id="follow"></div></section>
      <section class="card"><h2>Personal claims allowed</h2><div id="signal"></div></section>
    </div>
  </div>

  <div class="bar">
    <button class="btn p" id="play">▶ Play</button>
    <button class="btn" id="why">Why</button>
    <button class="btn" id="spd">4&times;</button>
    <button class="btn" id="wide" aria-pressed="false">Wide</button>
    <button class="btn" id="snd" aria-pressed="false">Sound</button>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <div class="right">
      <button class="btn" id="mAnalyst" aria-pressed="true">Analyst</button>
      <button class="btn" id="mFan" aria-pressed="false">Fan</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const L = 105, W = 68, FULL = 5400;       // pitch metres, match seconds
let FEED, cv, ctx, DPR = 1, VW = 0, VH = 0;
let clock = 0, playing = false, last = 0, idx = -1, mode = 'analyst', showWhy = false;
const SPEEDS = [1, 4, 12];                // match-seconds per real second
let SPEED = 4;
let TRAIL = SPEED * 2.4;                  // event fade, in match-seconds

/* ================== broadcast camera ==================
   A real main camera does not show the whole pitch -- it sits in the
   stand and tracks the ball, which is why its players read as people
   and a full-pitch diagram's never do. Full-pitch framing puts the far
   side at ~8px tall; this keeps them at 29-53px.

   The camera dollies along the touchline rather than panning from a
   fixed point. Visually identical at this distance, but it keeps the
   player scale constant across the match, which panning would not. */
const RIG = {
  back: 42,     // metres behind the near touchline
  up: 28,       // metres above pitch level
  look: 32,     // aim point, metres across from the near touchline
  span: 62,     // metres of pitch LENGTH across the viewport
  wide: 118,    // "Wide" pulls out to the whole pitch
};
let camX = L / 2, wide = false;
// Cached per-layout projection constants.
let CAM = null;

function buildCam() {
  const reach = RIG.look + RIG.back, len = Math.hypot(reach, RIG.up);
  // Camera basis collapses because the rig has no roll and no x-offset:
  // right is +x, so a = dx and only b,c need the 2x2 below.
  const fy = reach / len, fz = -RIG.up / len;
  const span = wide ? RIG.wide : RIG.span;

  // depth and height of a ground point at lateral distance y
  const cAt = y => fy * (y + RIG.back) + fz * (0 - RIG.up);
  const bAt = y => -fz * (y + RIG.back) + fy * (0 - RIG.up);

  // Focal length so `span` metres at mid-pitch depth fills the width,
  // then clamped so the grass always FILLS the frame: never so long that
  // the far touchline leaves it, never so short that the pitch floats in
  // a band of black. On a narrow window that means showing less pitch
  // rather than shrinking it, which is what a camera operator would do.
  const dUnit = Math.abs(bAt(W) / cAt(W) - bAt(0) / cAt(0));
  const room = VH - 86;
  const fl = Math.max(room * .88 / dUnit,
    Math.min(room / dUnit, VW * cAt(W / 2) / span));

  const cy = VH * 0.50 + fl * (bAt(0) / cAt(0) + bAt(W) / cAt(W)) / 2;
  CAM = { fy, fz, fl, cx: VW / 2, cy };
}

/* World (x, y, z) -> [screenX, screenY, depth]. z is height above turf. */
function P(x, y, z) {
  const dy = y + RIG.back, dz = (z || 0) - RIG.up;
  const c = CAM.fy * dy + CAM.fz * dz;
  const b = -CAM.fz * dy + CAM.fy * dz;
  return [CAM.cx + CAM.fl * (x - camX) / c, CAM.cy - CAM.fl * b / c, c];
}
/* Pixels per metre at a given lateral depth -- line weights and marker
   sizes have to shrink with distance or the far half looks pasted on. */
const mpp = y => CAM.fl / (CAM.fy * (y + RIG.back) + CAM.fz * (0 - RIG.up));

function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  VW = r.width; VH = r.height;
  cv.width = VW * DPR; cv.height = VH * DPR;
  buildCam();
}

/* Away events arrive in the possessing team's frame. */
const EX = (x, away) => (away ? L - x : x);
const EY = (y, away) => (away ? W - y : y);

/* ================== pitch ================== */
function poly(g, pts, close) {
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  if (close) g.closePath();
}
/* A circle on the turf is an ellipse on screen, and not a centred one --
   perspective pushes the far side in. Sampling the real circle is both
   simpler and correct. */
function ring(x, y, r, from, to, n) {
  const pts = [];
  const a0 = from == null ? 0 : from, a1 = to == null ? Math.PI * 2 : to;
  const steps = n || 48;
  for (let i = 0; i <= steps; i++) {
    const a = a0 + (a1 - a0) * i / steps;
    pts.push(P(x + Math.cos(a) * r, y + Math.sin(a) * r, 0));
  }
  return pts;
}

/* ================== turf ==================
   Grass is a texture, not a fill. Everything static about the surface --
   the two-tone mow bands, a faint cross-cut, wear at the goalmouths and
   down the central channel, mottling, the floodlight pools -- is baked
   once into an offscreen canvas in PITCH coordinates, then drawn through
   the camera every frame.

   Canvas 2D cannot draw an image in perspective, but this camera has no
   roll, so every row of the pitch maps to exactly one horizontal row of
   the screen with a uniform scale. That means the texture can be drawn
   as a stack of thin screen-space bands, each a plain scaled drawImage:
   the mode-7 trick, and here it is exact rather than an approximation. */
const TURF_T = 14;                       // texture pixels per metre
const TX0 = -16, TX1 = L + 16, TY0 = -9, TY1 = W + 2.2;
let TURF = null, TURFM = null;

function mulberry(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildTurf() {
  const wM = TX1 - TX0, hM = TY1 - TY0;
  const c = document.createElement('canvas');
  c.width = Math.round(wM * TURF_T); c.height = Math.round(hM * TURF_T);
  const t = c.getContext('2d');
  const X = x => (x - TX0) * TURF_T;
  const Y = y => (TY1 - y) * TURF_T;      // row 0 is the far edge
  const rng = mulberry(2026);

  // Base: cooled from pure broadcast green, because the chrome around it
  // is aubergine and a saturated green fights purple. Darker at the far
  // side, where the light has further to travel.
  const base = t.createLinearGradient(0, 0, 0, c.height);
  base.addColorStop(0, '#163526');
  base.addColorStop(.5, '#1f5039');
  base.addColorStop(1, '#19422f');
  t.fillStyle = base; t.fillRect(0, 0, c.width, c.height);

  // Mow bands: a real two-tone, not a white wash. The light band leans
  // yellow because bent blades show their undersides to the camera.
  for (let i = -2; i < 18; i += 2) {
    t.fillStyle = 'rgba(190,220,120,.055)';
    t.fillRect(X(i * L / 16), 0, L / 16 * TURF_T, c.height);
  }
  // Faint cross-cut the other way: the grid a groundsman leaves.
  for (let j = 0; j < 10; j += 2) {
    t.fillStyle = 'rgba(255,255,255,.016)';
    t.fillRect(0, Y((j + 1) * W / 10), c.width, W / 10 * TURF_T);
  }

  // Mottle: low-frequency patchiness. A uniform lawn is a render; grass
  // grows unevenly.
  for (let i = 0; i < 420; i++) {
    const px = TX0 + rng() * wM, py = TY0 + rng() * hM;
    const r = (2.5 + rng() * 5.5) * TURF_T;
    const up = rng() > .5;
    const gl = t.createRadialGradient(X(px), Y(py), 0, X(px), Y(py), r);
    // The dark flecks carry less weight than the light ones: under
    // perspective compression a dark spot reads as a mark on the pitch,
    // a light one reads as light.
    gl.addColorStop(0, up ? 'rgba(205,235,150,.040)' : 'rgba(10,28,17,.028)');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    t.fillStyle = gl;
    t.beginPath(); t.arc(X(px), Y(py), r, 0, 7); t.fill();
  }

  // Wear: the goalmouths, the penalty spots, the centre, and a tired
  // central channel. Sand and thin grass, not paint.
  const wear = (px, py, rx, ry, a) => {
    const gl = t.createRadialGradient(X(px), Y(py), 0, X(px), Y(py), rx * TURF_T);
    gl.addColorStop(0, `rgba(122,106,64,${a})`);
    gl.addColorStop(.55, `rgba(122,106,64,${a * .5})`);
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    t.fillStyle = gl;
    t.save(); t.translate(X(px), Y(py)); t.scale(1, ry / rx);
    t.beginPath(); t.arc(0, 0, rx * TURF_T, 0, 7); t.fill(); t.restore();
  };
  wear(3.2, W / 2, 9, 5, .16); wear(L - 3.2, W / 2, 9, 5, .16);
  wear(11, W / 2, 3.4, 2.4, .12); wear(L - 11, W / 2, 3.4, 2.4, .12);
  wear(L / 2, W / 2, 7, 5, .1);
  for (let i = 0; i < 9; i++) wear(L * .2 + rng() * L * .6, W / 2 + (rng() - .5) * 14,
                                   3 + rng() * 4, 2 + rng() * 2, .05);

  // Blade grain, anchored to the pitch (the screen-space grain that runs
  // over the whole frame each frame belongs to the camera; this belongs
  // to the grass).
  const n = document.createElement('canvas'); n.width = n.height = 128;
  const nx = n.getContext('2d'), d = nx.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 90 + (rng() * 165) | 0;
    d.data[i] = v * .8; d.data[i + 1] = v; d.data[i + 2] = v * .82;
    d.data[i + 3] = 14;
  }
  nx.putImageData(d, 0, 0);
  t.fillStyle = t.createPattern(n, 'repeat');
  t.fillRect(0, 0, c.width, c.height);

  // Floodlight pools, baked: they are fixed to the ground, so they cost
  // nothing per frame here.
  for (const fx of [L * .16, L * .5, L * .84]) {
    const r = 34 * TURF_T;
    const gl = t.createRadialGradient(X(fx), Y(W * .45), 0, X(fx), Y(W * .45), r);
    gl.addColorStop(0, 'rgba(226,255,238,.06)');
    gl.addColorStop(.6, 'rgba(226,255,238,.02)');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    t.fillStyle = gl;
    t.beginPath(); t.arc(X(fx), Y(W * .45), r, 0, 7); t.fill();
  }
  TURF = c;

  // Mip chain. Canvas drawImage has no mipmaps, and at the far touchline
  // a band downscales the texture ~10x vertically: bilinear undersamples
  // that badly, and every dark fleck in the mottle becomes a hard black
  // streak. Each halving below IS the pre-filter; drawTurf picks the
  // level that keeps the per-band scale near one.
  TURFM = [c];
  let prev = c;
  while (prev.width > 240 && TURFM.length < 4) {
    const m = document.createElement('canvas');
    m.width = Math.ceil(prev.width / 2); m.height = Math.ceil(prev.height / 2);
    m.getContext('2d').drawImage(prev, 0, 0, m.width, m.height);
    TURFM.push(m); prev = m;
  }
}

/* Invert the projection for the ground plane: which pitch row is on
   screen row ys. Exact because the rig has no roll. */
function yAtScreen(ys) {
  const q = CAM.cy - ys;
  const dy = RIG.up * (q * CAM.fz - CAM.fl * CAM.fy) / (q * CAM.fy + CAM.fl * CAM.fz);
  return dy - RIG.back;
}

function drawTurf() {
  const g = ctx;
  if (!TURF) return;
  const top = Math.max(0, Math.ceil(P(camX, TY1, 0)[1]));
  const bot = Math.min(VH, P(camX, TY0, 0)[1]);
  // Adaptive bands: perspective changes fast at the horizon and slowly
  // near the camera, so the strips can be thin where it matters and
  // thick where it does not. Roughly a third the draw calls of a fixed
  // step for the same picture.
  const span = Math.max(1, bot - top);
  for (let ys = top; ys < bot;) {
    const f = (ys - top) / span;
    const h = Math.min(3 + 11 * f * f, bot - ys);
    const y0 = Math.min(TY1, yAtScreen(ys));          // far edge of band
    const y1 = Math.max(TY0, yAtScreen(ys + h));      // near edge
    if (y0 > y1) {
      const s = mpp((y0 + y1) / 2);
      // Pick the mip whose vertical scale is nearest one for this band.
      const ratio = (y0 - y1) * TURF_T / h;
      const lvl = Math.max(0, Math.min(TURFM.length - 1, Math.floor(Math.log2(ratio / 1.2))));
      const sc = 1 << lvl, tex = TURFM[lvl];
      g.drawImage(tex,
        0, (TY1 - y0) * TURF_T / sc, tex.width, Math.max(1, (y0 - y1) * TURF_T / sc),
        CAM.cx + s * (TX0 - camX), ys, s * (TX1 - TX0), h);
    }
    ys += h;
  }
}

function drawPitch() {
  const g = ctx;
  g.fillStyle = '#05080b'; g.fillRect(0, 0, VW, VH);

  // Beyond the far touchline: a stand in shadow, tinted toward the
  // chrome's aubergine rather than left as flat black. Dead black above
  // the grass reads as a crop; a tinted stand reads as a stadium, and
  // ties the frame to the graphics package around it.
  const horizon = P(camX, W, 0)[1];
  const sky = g.createLinearGradient(0, 0, 0, horizon + 6);
  sky.addColorStop(0, '#0B0010');
  sky.addColorStop(.55, '#140420');
  sky.addColorStop(1, '#220C2B');
  g.fillStyle = sky; g.fillRect(0, 0, VW, horizon + 6);
  // Faint tiers, so the shadow has structure in it.
  g.fillStyle = 'rgba(255,255,255,.012)';
  for (let i = 1; i <= 7; i++) {
    const y = horizon - i * (horizon / 7.6);
    g.fillRect(0, y, VW, Math.max(1, horizon / 26));
  }

  drawTurf();

  g.strokeStyle = 'rgba(214,236,252,.42)'; g.lineJoin = 'round';
  const w = y => Math.max(.8, 0.12 * mpp(y));
  const seg = (ax, ay, bx, by) => {
    g.lineWidth = w((ay + by) / 2);
    poly(g, [P(ax, ay, 0), P(bx, by, 0)]); g.stroke();
  };
  const box = (x0, y0, x1, y1) => {
    g.lineWidth = w((y0 + y1) / 2);
    poly(g, [P(x0, y0, 0), P(x1, y0, 0), P(x1, y1, 0), P(x0, y1, 0)], true); g.stroke();
  };
  box(0, 0, L, W);
  seg(L / 2, 0, L / 2, W);
  g.lineWidth = w(W / 2); poly(g, ring(L / 2, W / 2, 9.15), true); g.stroke();
  box(0, (W - 40.3) / 2, 16.5, (W + 40.3) / 2);
  box(L - 16.5, (W - 40.3) / 2, L, (W + 40.3) / 2);
  box(0, (W - 18.3) / 2, 5.5, (W + 18.3) / 2);
  box(L - 5.5, (W - 18.3) / 2, L, (W + 18.3) / 2);

  // Penalty arcs: the part of the 9.15m circle outside the box.
  const th = Math.acos((16.5 - 11) / 9.15);
  g.lineWidth = w(W / 2);
  poly(g, ring(11, W / 2, 9.15, -th, th, 22)); g.stroke();
  poly(g, ring(L - 11, W / 2, 9.15, Math.PI - th, Math.PI + th, 22)); g.stroke();

  g.fillStyle = 'rgba(214,236,252,.42)';
  for (const sx of [11, L / 2, L - 11]) {
    poly(g, ring(sx, W / 2, .35, 0, Math.PI * 2, 12), true); g.fill();
  }

  // Perimeter boards beyond the far touchline. Without a horizon the
  // pitch hangs in black and the frame reads as a diagram on a page
  // rather than a camera pointed at a stadium.
  const bY = W + 1.1, bH = 1.05;
  const bl = P(-16, bY, 0), br = P(L + 16, bY, 0);
  const tl = P(-16, bY, bH), tr = P(L + 16, bY, bH);
  const bg = g.createLinearGradient(0, tl[1], 0, bl[1]);
  bg.addColorStop(0, '#1b2731'); bg.addColorStop(1, '#0d151b');
  poly(g, [bl, br, tr, tl], true); g.fillStyle = bg; g.fill();
  g.strokeStyle = 'rgba(150,180,205,.2)'; g.lineWidth = 1;
  poly(g, [tl, tr]); g.stroke();

  drawGoals();
}

/* Real posts with height. A goal drawn as a flat line is the single
   clearest tell that a pitch is a diagram. */
function drawGoals() {
  const g = ctx, H = 2.44, half = 3.66;
  for (const gx of [0, L]) {
    const depth = gx === 0 ? -1.9 : 1.9;        // net runs away from play
    const y0 = W / 2 - half, y1 = W / 2 + half;
    const p0 = P(gx, y0, 0), p1 = P(gx, y1, 0);
    const t0 = P(gx, y0, H), t1 = P(gx, y1, H);
    const b0 = P(gx + depth, y0, 0), b1 = P(gx + depth, y1, 0);
    const u0 = P(gx + depth, y0, H * .78), u1 = P(gx + depth, y1, H * .78);

    g.strokeStyle = 'rgba(150,180,205,.17)'; g.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {              // net
      const f = i / 8;
      const a = [p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f];
      const b = [b0[0] + (b1[0] - b0[0]) * f, b0[1] + (b1[1] - b0[1]) * f];
      const c = [t0[0] + (t1[0] - t0[0]) * f, t0[1] + (t1[1] - t0[1]) * f];
      const d = [u0[0] + (u1[0] - u0[0]) * f, u0[1] + (u1[1] - u0[1]) * f];
      poly(g, [c, d, b]); g.stroke();
      poly(g, [a, b]); g.stroke();
    }
    for (let i = 0; i <= 4; i++) {
      const f = i / 4;
      const a = [t0[0] + (u0[0] - t0[0]) * f, t0[1] + (u0[1] - t0[1]) * f];
      const b = [t1[0] + (u1[0] - t1[0]) * f, t1[1] + (u1[1] - t1[1]) * f];
      poly(g, [a, b]); g.stroke();
    }
    g.strokeStyle = 'rgba(236,246,255,.92)';
    g.lineWidth = Math.max(1.6, .13 * mpp(W / 2)); g.lineCap = 'round';
    poly(g, [p0, t0]); g.stroke();
    poly(g, [p1, t1]); g.stroke();
    poly(g, [t0, t1]); g.stroke();
  }
}

/* ================== event trails ================== */
function drawEvents() {
  const g = ctx;
  g.lineCap = 'round';
  const home = FEED.match.home.id;
  for (const e of FEED.stream) {
    const age = clock - e.t;
    if (age < 0 || age > TRAIL) continue;
    const a = Math.pow(1 - age / TRAIL, 1.7);
    const away = e.m !== home;
    const col = away ? '255,176,32' : '90,169,255';
    const ex = EX(e.x, away), ey = EY(e.y, away);
    const p1 = P(ex, ey, 0);
    const k = mpp(ey);

    if (e.k === 'pa' || e.k === 'ca') {
      const tx = e.X != null ? EX(e.X, away) : ex, ty = e.Y != null ? EY(e.Y, away) : ey;
      // The trail grows at the ball's own pace, so line and ball arrive
      // together: a trail that outruns its pass is another small lie.
      const dist = Math.hypot(tx - ex, ty - ey);
      const grow = e.k === 'pa'
        ? Math.min(1, age / flightTime('pa', dist))
        : Math.min(1, age * 7 / Math.max(4, dist));
      const p2 = P(ex + (tx - ex) * grow, ey + (ty - ey) * grow, 0);
      g.strokeStyle = e.f ? `rgba(255,95,95,${a * .32})` : `rgba(${col},${a * .42})`;
      g.lineWidth = Math.max(1, (e.k === 'ca' ? .18 : .11) * k);
      if (e.f) g.setLineDash([3, 4]);
      poly(g, [p1, p2]); g.stroke(); g.setLineDash([]);
    } else if (e.k === 'sh') {
      const gx = away ? 0 : L;
      const grow = Math.min(1, age / flightTime('sh', Math.hypot(gx - ex, W / 2 - ey)));
      const p2 = P(ex + (gx - ex) * grow, ey + (W / 2 - ey) * grow, 0);
      g.strokeStyle = e.g ? `rgba(61,220,132,${a})` : `rgba(${col},${a * .8})`;
      g.lineWidth = Math.max(1.6, .2 * k);
      poly(g, [p1, p2]); g.stroke();
      if (e.g) {
        g.strokeStyle = `rgba(61,220,132,${a * .9})`; g.lineWidth = Math.max(1.4, .13 * k);
        poly(g, ring(ex, ey, (1 - a) * 7 + 1.2, 0, Math.PI * 2, 24), true); g.stroke();
      }
    } else if (e.k === 're') {
      g.strokeStyle = `rgba(255,255,255,${a * .5})`; g.lineWidth = Math.max(1, .1 * k);
      poly(g, ring(ex, ey, (1 - a) * 3.4 + .7, 0, Math.PI * 2, 20), true); g.stroke();
    } else if (e.k === 'pr') {
      g.fillStyle = `rgba(255,95,95,${a * .3})`;
      poly(g, ring(ex, ey, .55, 0, Math.PI * 2, 10), true); g.fill();
    }
  }
}

/* ================== the ball ==================
   The packed frames sample at 1.5 seconds and a pass takes less than
   that, so a ball read from the frames is low-pass filtered into a
   float: it drifts between events in straight lines at an even pace,
   which is most of what made the match read as random. Football reads
   as football because the ball has two speeds -- it ZIPS along a pass,
   then DWELLS at someone's feet -- so the ball is rebuilt here from the
   event stream itself, which carries each pass's real start and end.

   Pressure events are excluded: a presser is NEAR the ball, not the
   ball, and steering at him is what made the track wobble.

   Long passes travel in the air. The camera is a true projection, so a
   lofted ball is literally drawn at height z while its shadow stays on
   the turf -- the gap between them is what sells the arc. */
const BALL_V = { pa: 17, sh: 24 };          // m/s, plausible flight speeds
function flightTime(kind, dist) {
  const v = BALL_V[kind];
  return v ? Math.max(.25, Math.min(2.2, dist / v)) : 0;
}

let BALL = null;
function buildBallTrack() {
  const home = FEED.match.home.id;
  const evs = FEED.stream.filter(e => e.k !== 'pr');
  const seg = [];
  for (let i = 0; i < evs.length; i++) {
    const e = evs[i], away = e.m !== home;
    const ax = EX(e.x, away), ay = EY(e.y, away);
    const bx = e.X != null ? EX(e.X, away) : ax;
    const by = e.Y != null ? EY(e.Y, away) : ay;
    const n = evs[i + 1];
    const t1 = n ? Math.max(n.t, e.t + .05) : e.t + 4;
    const nAway = n ? n.m !== home : away;
    const dist = Math.hypot(bx - ax, by - ay);
    // A carry is not a flight: the ball moves at the carrier's pace for
    // the whole window. Everything else zips, then settles.
    // Flight never fills the window: the settle keeps at least a quarter
    // of it, so the glide to wherever the next event begins is always a
    // movement and never a teleport between segments.
    let ft = e.k === 'ca' ? (t1 - e.t) : flightTime(e.k, dist);
    ft = Math.max(.01, Math.min(ft, (t1 - e.t) * (e.k === 'ca' ? .9 : .74)));
    const loft = e.k === 'pa' && dist > 20 ? Math.min(7, dist * .18)
               : e.k === 'sh' ? .9 : 0;
    let cx = n ? EX(n.x, nAway) : bx, cy = n ? EY(n.y, nAway) : by;
    // A big gap to the next event is a RESTART -- a goal, then a kickoff
    // fifty metres away -- not a journey the ball makes. Broadcast cuts
    // to a restart; it does not show the ball streaking back to the
    // centre spot. Hold at the dead-ball spot and let the next segment
    // open with a cut.
    if (Math.hypot(cx - bx, cy - by) > 12) { cx = bx; cy = by; }
    seg.push({ t0: e.t, t1, ax, ay, bx, by, cx, cy, ft, loft, carry: e.k === 'ca' });
  }
  return seg;
}

/* -> {x, y, z, dwell, age}: dwell means the ball is in someone's
   possession rather than in flight; age is seconds since it settled. */
function ballAt(t) {
  const s = BALL;
  if (!s || !s.length) return { x: L / 2, y: W / 2, z: 0, dwell: true, age: 9 };
  let lo = 0, hi = s.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (s[mid].t0 <= t) lo = mid; else hi = mid - 1;
  }
  const g = s[lo];
  if (t <= g.t0) return { x: g.ax, y: g.ay, z: 0, dwell: true, age: 9 };
  const u = Math.min(1, (t - g.t0) / g.ft);
  if (u < 1) {
    // A ground pass leaves the foot fast and friction takes the rest:
    // it decelerates into the receiver. Only a ball in the air travels
    // at roughly constant pace. Constant-velocity ground passes are a
    // large part of why the ball read as "moving on a line".
    const ue = (g.carry || g.loft > 0) ? u : 1 - Math.pow(1 - u, 1.7);
    return {
      x: g.ax + (g.bx - g.ax) * ue,
      y: g.ay + (g.by - g.ay) * ue,
      z: g.loft * 4 * u * (1 - u),
      dwell: g.carry, age: g.carry ? t - g.t0 : 0,
    };
  }
  // Settled: ease across the small gap to where the next event begins,
  // which is the receiver bringing it under control and moving with it.
  const rest = Math.max(.01, g.t1 - g.t0 - g.ft);
  const v = Math.max(0, Math.min(1, (t - g.t0 - g.ft) / rest));
  const e2 = v * v * (3 - 2 * v);
  return {
    x: g.bx + (g.cx - g.bx) * e2, y: g.by + (g.cy - g.by) * e2,
    z: 0, dwell: true, age: t - g.t0 - g.ft,
  };
}

/* ================== people ==================
   A numbered circle is a counter. What makes it a player is height: a
   figure that stands on the grass, casts a shadow, faces where it is
   running and leans into a turn. */
const KIT = {
  home: { shirt: '#2f7fe0', trim: '#8cc6ff', short: '#16294b', sock: '#23548f', ink: '#eaf4ff' },
  away: { shirt: '#eca322', trim: '#ffdc96', short: '#3d2c0c', sock: '#9c6b12', ink: '#2a1d04' },
};
const SKIN = '#434b55', LEG = '#333a44';
const STRIDE = 1.75;                 // metres per half gait cycle
const phase = { home: new Float32Array(11), away: new Float32Array(11) };
const facing = { home: new Float32Array(11), away: new Float32Array(11) };

let SHADOW = null;
function buildShadow() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const gl = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gl.addColorStop(0, 'rgba(0,0,0,.55)');
  gl.addColorStop(.42, 'rgba(0,0,0,.33)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gl;
  x.beginPath(); x.arc(32, 32, 32, 0, 7); x.fill();
  SHADOW = c;
}

/* Catmull-Rom through the 1.5s samples. Straight-line interpolation
   renders a smooth run as a dog-leg at every sample boundary. */
function cr(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return .5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2
    + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
function at(arr, stride, off, t) {
  const F = FEED.frames;
  const k = (t - F.t0) / F.dt;
  const i = Math.max(0, Math.min(F.n - 1, Math.floor(k)));
  const u = Math.max(0, Math.min(1, k - i));
  const a = Math.max(0, i - 1), b = Math.min(F.n - 1, i + 1), c = Math.min(F.n - 1, i + 2);
  return [
    cr(arr[a * stride + off], arr[i * stride + off], arr[b * stride + off], arr[c * stride + off], u),
    cr(arr[a * stride + off + 1], arr[i * stride + off + 1], arr[b * stride + off + 1], arr[c * stride + off + 1], u),
  ];
}

/* One footballer, drawn in body-height units from the feet up.
   The silhouette is the whole job at this size: a head bump, narrow
   shoulders and -- the part that matters -- daylight between two legs.
   A solid tapered body over a dark ellipse is a chess pawn, which is
   exactly what the first version of this looked like. */
function figure(g, h, kit, ph, front, profile, num, lean, gait) {
  const sp = Math.sin(ph) * gait;                // gait=0 -> feet together
  const sw = .31 * (.62 + .38 * front);          // wide head-on, narrow in profile
  const sx = .155 * profile, sy = .038 * front;  // stride reads in x, foreshortens in y
  const stance = .048;                           // feet apart even at rest
  const HIP = -.44, WAIST = -.57, SHOULDER = -.80;
  const bob = Math.abs(Math.cos(ph)) * .02 * gait;   // rises mid-stride

  g.save();
  g.rotate(lean); g.scale(h, h);
  g.lineCap = 'round'; g.lineJoin = 'round';

  // Legs with mass: a thigh wider than its calf, bent at the knee, a
  // muted kit sock on the shin. Thread-width legs under a filled torso
  // were most of why the figures read as having no body.
  const leg = (dir) => {
    const hx = dir * stance, fx = dir * stance + sp * dir * sx;
    const fy = -Math.max(0, sp * dir) * .07 + sp * dir * sy;
    const kx = (hx + fx) / 2 + sp * dir * sx * .45;
    const ky = (HIP + fy) / 2 - .02;
    g.strokeStyle = LEG; g.lineWidth = .088;                      // thigh
    g.beginPath(); g.moveTo(hx, HIP + .03); g.lineTo(kx, ky); g.stroke();
    g.lineWidth = .064;                                           // calf
    g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
    g.strokeStyle = kit.sock; g.lineWidth = .066;                 // sock
    g.beginPath();
    g.moveTo(kx + (fx - kx) * .45, ky + (fy - ky) * .45); g.lineTo(fx, fy); g.stroke();
  };
  leg(-1); leg(1);

  // Everything above the legs bobs with the stride: highest as the legs
  // pass each other, lowest at footstrike. Up is negative here.
  g.translate(0, -bob);

  // One connected silhouette, shoulders through hips. A shirt triangle
  // floating above a separate shorts box reads as parts, not a person;
  // shirt and shorts here are two fills of the same body.
  const body = () => {
    g.beginPath();
    g.moveTo(-sw / 2, SHOULDER); g.lineTo(sw / 2, SHOULDER);
    g.lineTo(sw * .43, WAIST);
    g.lineTo(sw * .47, HIP - .015); g.lineTo(-sw * .47, HIP - .015);
    g.lineTo(-sw * .43, WAIST);
    g.closePath();
  };
  g.fillStyle = kit.short; body(); g.fill();
  g.save(); body(); g.clip();
  g.fillStyle = kit.shirt;
  g.fillRect(-sw, SHOULDER - .02, sw * 2, WAIST - SHOULDER + .02);
  g.fillStyle = kit.trim;                        // centre stripe
  g.fillRect(-sw * .062, SHOULDER, sw * .124, WAIST - SHOULDER);
  g.restore();
  body(); g.strokeStyle = 'rgba(4,8,11,.42)'; g.lineWidth = .02; g.stroke();

  // arms swing against the legs, close to the body
  g.strokeStyle = kit.shirt; g.lineWidth = .06;
  g.beginPath(); g.moveTo(-sw * .46, SHOULDER + .035); g.lineTo(-sw * .52 + sp * sx * .45, WAIST + .01); g.stroke();
  g.beginPath(); g.moveTo(sw * .46, SHOULDER + .035); g.lineTo(sw * .52 - sp * sx * .45, WAIST + .01); g.stroke();

  if (num != null) {
    g.fillStyle = kit.ink;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 .15px "Archivo Variable",system-ui,sans-serif';
    g.fillText(num, 0, SHOULDER + .105);
  }

  // neck, then head -- without the neck the head floats like a pinhead
  g.fillStyle = SKIN;
  g.fillRect(-.036, SHOULDER - .05, .072, .06);
  g.beginPath(); g.arc(0, -.9, .078, 0, 7); g.fill();
  g.restore();
}

function drawPeople() {
  const F = FEED.frames;
  if (!F || !F.n) return;
  const g = ctx;
  const back = Math.max(F.t0, clock - .22);
  const b = ballAt(clock);
  let bx = b.x, by = b.y;

  const cast = [];
  let carry = null, carryD = 1e9;
  for (const side of ['home', 'away']) {
    const arr = side === 'home' ? F.h : F.a;
    const kit = KIT[side];
    const xi = FEED.lineups ? FEED.lineups[side] : null;
    for (let p = 0; p < 11; p++) {
      const [x, y] = at(arr, 22, p * 2, clock);
      const [px, py] = at(arr, 22, p * 2, back);
      const vx = (x - px) / .22, vy = (y - py) / .22;
      const sp = Math.hypot(vx, vy);
      const d = Math.hypot(x - bx, y - by);
      const rec = { side, p, x, y, vx, vy, sp, kit, man: xi ? xi[p] : null };
      if (d < carryD) { carryD = d; carry = rec; }
      cast.push(rec);
    }
  }

  // A settled ball belongs at somebody's feet. The track puts it where
  // the events say; the nearest player is the man in possession, so the
  // ball is drawn ON him, leading his run slightly -- which is what
  // separates "he has the ball" from "a ball is near him". The blend
  // ramps over the first half second so control is gathered, not
  // teleported.
  if (b.dwell && carry && carryD < 2.4 && carry.sp !== undefined) {
    const w = Math.min(1, b.age / .5) * .9;
    const lead = Math.max(.1, Math.min(.45, carry.sp * .09));
    const tx = carry.x + (carry.sp > .3 ? carry.vx / carry.sp * lead : 0);
    const ty = carry.y + (carry.sp > .3 ? carry.vy / carry.sp * lead : 0);
    bx += (tx - bx) * w; by += (ty - by) * w;
  }

  // The RENDERED ball chases the model ball through a short lag. This is
  // what joins the pieces into one movement: the kick departs from where
  // the ball actually was at the passer's feet (not from wherever the
  // event log rounded it to), and both ends of a flight ease instead of
  // starting and stopping dead. A restart or a seek snaps -- those are
  // cuts, and smoothing across a cut would draw the very streak the cut
  // exists to avoid.
  if (!VISB || Math.hypot(bx - VISB.x, by - VISB.y) > 20
      || Math.abs(clock - VISB.t) > 5) {
    VISB = { x: bx, y: by, t: clock };
  } else {
    // The lag is constant in MATCH time, not wall time, so a pass keeps
    // the same shape at 1x and 12x instead of smearing as playback
    // speeds up.
    const kk = 1 - Math.exp(-DT * SPEED / .09);
    VISB.x += (bx - VISB.x) * kk;
    VISB.y += (by - VISB.y) * kk;
    VISB.t = clock;
  }
  bx = VISB.x; by = VISB.y;

  // Ground marker under the man on the ball: a broadcast spotlight reads
  // far better than a ring round a dot, and survives the perspective.
  // Only while the ball is in someone's possession -- a ring that chases
  // a pass mid-flight flickers across whoever it overtakes.
  if (b.dwell && carry && carryD < 3.5) {
    g.strokeStyle = carry.side === 'home'
      ? 'rgba(90,169,255,.85)' : 'rgba(255,176,32,.85)';
    g.lineWidth = Math.max(1.4, .1 * mpp(carry.y));
    poly(g, ring(carry.x, carry.y, 1.25, 0, Math.PI * 2, 26), true); g.stroke();
  }

  // Ball sorted in with the players so it can be occluded.
  cast.push({ ball: true, x: bx, y: by, z: b.z });
  cast.sort((a, b) => (b.y + RIG.back) - (a.y + RIG.back));   // far first

  for (const r of cast) {
    const foot = P(r.x, r.y, 0);
    const k = mpp(r.y);

    if (r.ball) {
      const rad = Math.max(1.6, .16 * k);
      // Shadow on the turf whatever the height; a lofted ball reads as
      // lofted because the shadow stays down while the ball does not.
      g.fillStyle = 'rgba(0,0,0,.4)';
      g.beginPath();
      g.ellipse(foot[0], foot[1], rad * (1.2 + r.z * .05), rad * .42, 0, 0, 7);
      g.fill();
      const pos = P(r.x, r.y, r.z + .11);
      g.beginPath(); g.arc(pos[0], pos[1], rad, 0, 7);
      g.fillStyle = '#fff'; g.shadowColor = 'rgba(255,255,255,.8)';
      g.shadowBlur = 9; g.fill(); g.shadowBlur = 0;
      continue;
    }

    const h = foot[1] - P(r.x, r.y, 1.84)[1];
    if (h < 4) continue;
    const front = r.sp > .4 ? Math.min(1, Math.abs(r.vy) / r.sp) : .5;
    const profile = r.sp > .4 ? Math.min(1, Math.abs(r.vx) / r.sp) : .4;

    // gait advances with distance covered, but capped: at 12x a true
    // cycle is a strobe, and legs that blur read as noise.
    const ph = phase[r.side];
    ph[r.p] += r.sp * GAIT / STRIDE * Math.PI;
    const lean = Math.max(-.16, Math.min(.16, r.vx / 9 * .15));

    // Shadow: soft and close. A flat dark ellipse under the feet is a
    // pedestal, and a figure on a pedestal is a chess piece however well
    // the figure itself is drawn.
    // One pre-rendered soft shadow, scaled per player. Building a radial
    // gradient per player per frame was pure waste: the shadow never
    // changes, only its size does.
    const sr = Math.max(5, .95 * k);
    g.drawImage(SHADOW, foot[0] - sr, foot[1] + Math.max(.5, .06 * k) - sr * .3,
      sr * 2, sr * .6);

    g.save(); g.translate(foot[0], foot[1]);
    figure(g, h, r.kit, ph[r.p], front, profile,
      h > 42 && r.man ? String(r.man.n) : null, lean,
      Math.min(1, r.sp / 3.4));          // stride grows with pace, so a
    g.restore();                         // standing player stands still

    // Name the man on the ball, as a broadcast would.
    if (r === carry && carryD < 3.5 && r.man) {
      const label = `${r.man.n}  ${r.man.last.toUpperCase()}`;
      g.font = `700 ${Math.max(11, Math.min(14, h * .3))}px "Archivo Variable",system-ui,sans-serif`;
      const tw = g.measureText(label).width + 16;
      const ty = foot[1] - h - 14;
      // Hard-edged, opaque, with a kit-coloured leading rule: the same
      // language as the chrome, not a rounded tooltip.
      g.fillStyle = '#1C0423';
      g.fillRect(foot[0] - tw / 2, ty - 10, tw, 21);
      g.fillStyle = r.side === 'home' ? '#5aa9ff' : '#ecA322';
      g.fillRect(foot[0] - tw / 2, ty - 10, 3, 21);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(label, foot[0] + 1.5, ty + .5);
    }
  }
}

/* ================== crowd ==================
   What sits under live play on a broadcast is not music, it is forty
   thousand people -- and a crowd is not filtered static, which is what
   realtime noise-through-bandpass synthesis sounds like. The bed and the
   roar are rendered OFFLINE by scripts/make_crowd.py: thousands of short
   voice-like grains (noise and buzz through vocal formants, with
   syllabic amplitude movement) overlap-added into a seamless loop and a
   one-shot. Still nobody else's audio, still no licence to clear, and
   the files are generated by a script in this repo, so they are as
   reproducible as the season itself.

   The browser's job is only the reactive part: the bed's level and
   brightness lean toward whichever box the ball is near, a shot gets the
   rising half of the roar and is cut off, a goal gets all of it --
   driven by the same event stream as everything else on screen. */
let AC = null, CROWD = null, sndOn = false, audioPtr = 0, lastAClock = -1, EXC = 0;

async function initCrowd() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const load = async url =>
    AC.decodeAudioData(await (await fetch(url)).arrayBuffer());
  const [bed, roar] = await Promise.all([
    load('audio/crowd.mp3'), load('audio/roar.mp3'),
  ]);
  const master = AC.createGain(); master.gain.value = .9;
  master.connect(AC.destination);
  const bedG = AC.createGain(); bedG.gain.value = .4;
  // A gentle distance filter only: the first version sat at 1.8kHz and
  // muffled the life out of a bed that now carries its own air.
  const bedF = AC.createBiquadFilter();
  bedF.type = 'lowpass'; bedF.frequency.value = 3200;
  const src = AC.createBufferSource(); src.buffer = bed; src.loop = true;
  src.connect(bedF); bedF.connect(bedG); bedG.connect(master); src.start();
  CROWD = { master, bedG, bedF, roar };
}

/* A reaction is the roar sample, scaled. A goal gets all of it; a miss
   gets the rise and is then cut off -- which is exactly what a missed
   chance sounds like. */
function crowdShot(intensity, cutAfter) {
  if (!CROWD || AC.state !== 'running') return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = CROWD.roar;
  s.playbackRate.value = .92 + Math.random() * .16 + (1 - intensity) * .15;
  const g = AC.createGain(); g.gain.value = .1 + .85 * intensity;
  s.connect(g); g.connect(CROWD.master);
  s.start(t);
  if (cutAfter) {
    g.gain.setTargetAtTime(0, t + cutAfter, .3);
    s.stop(t + cutAfter + 1.6);
  }
}

function crowdFrame(dtReal) {
  if (!CROWD || AC.state !== 'running') return;
  // The crowd leans toward whichever box the ball is near.
  const want = Math.max(0, Math.min(1, (Math.abs(ballAt(clock).x - L / 2) - 12) / 38));
  EXC += (want - EXC) * Math.min(1, dtReal * 1.5);
  const t = AC.currentTime;
  const breath = .88 + .12 * Math.sin(t * .31) * Math.sin(t * .13 + 2);
  CROWD.bedG.gain.setTargetAtTime(
    ((playing ? .4 : .18) + .45 * EXC) * breath, t, .3);
  CROWD.bedF.frequency.setTargetAtTime(
    (playing ? 3000 : 1900) + 4800 * EXC, t, .4);

  // React to what just happened. On a seek, drop the backlog rather than
  // roaring through half a match in one frame.
  if (clock < lastAClock - 1) audioPtr = 0;
  const st = FEED.stream;
  while (audioPtr < st.length && st[audioPtr].t <= clock) {
    const e = st[audioPtr++];
    if (clock - e.t > 2) continue;
    if (e.k === 'sh') crowdShot(e.g ? 1 : .4, e.g ? 0 : 1.1);
  }
  lastAClock = clock;
}

/* ================== loop ================== */
let GAIT = 0, DT = 1 / 60, VISB = null;

/* Film grain is a property of the camera, not the pitch, so it sits over
   the whole frame -- but painting it INTO the canvas was two thirds of
   the entire frame budget (a full-screen pattern fill at retina scale,
   every frame). It lives in a composited CSS overlay instead: the canvas
   never touches it, and a stepped transform animation keeps it moving,
   because grain that holds still reads as a dirty lens. */
function makeGrain() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d'), d = x.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 110 + ((Math.random() * 145) | 0);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = 10;
  }
  x.putImageData(d, 0, 0);
  const el = document.createElement('div');
  el.className = 'grain';
  el.style.backgroundImage = `url(${c.toDataURL()})`;
  document.querySelector('.field').appendChild(el);
}
function frame(now) {
  const dtReal = Math.min(.1, (now - last) / 1000);
  last = now;
  DT = dtReal;
  if (playing) {
    clock = Math.min(FULL, clock + dtReal * SPEED);
    if (clock >= FULL) pause();
    sync();
  }
  // Gait is driven by real seconds, not match seconds: at 12x the legs
  // would otherwise cycle twelve times too fast and read as vibration.
  GAIT = dtReal * Math.min(SPEED, 3);

  // Camera dolly: hold for small movements, then ease across. A camera
  // that tracks every touch makes the world move instead of the lens.
  if (BALL) {
    const target = Math.max(28, Math.min(L - 28, ballAt(clock).x));
    const err = target - camX, dz = 7;
    const want = Math.abs(err) <= dz ? camX : target - Math.sign(err) * dz;
    camX += (want - camX) * (1 - Math.exp(-dtReal * Math.min(SPEED, 6) / 1.4));
  }

  crowdFrame(dtReal);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawPitch(); drawEvents(); drawPeople();
  requestAnimationFrame(frame);
}

/* ================== moments ================== */
function minuteNow() { return Math.floor(clock / 60); }

function showMoment(i) {
  const m = FEED.moments[i];
  if (!m) return;
  idx = i;
  const lo = $('#lower');
  lo.classList.toggle('dn', !m.above);
  $('#lName').textContent = m.player;
  $('#lMeta').textContent = `${m.club} · ${m.minute}' · ${m.metric}`;
  // Two deliberate lines rather than one that wraps: "league-/wide"
  // breaking across a line looks like a bug, because it is one.
  const tag = m.diverges
    ? [m.above ? 'above his level' : 'below his level', 'ordinary league-wide']
    : (m.above ? ['above his level', "and the league's"] : ['below', 'his own level']);
  $('#lTag').innerHTML = tag.map(t => `<span>${t}</span>`).join('');
  $('#lSaid').textContent = m.text;

  // The Form Line is the hero block, read first. Everything else on the
  // strap is a supporting figure any competitor could also show.
  const hero = $('#lForm');
  if (m.season_mean != null) {
    hero.textContent = `${m.z > 0 ? '+' : ''}${m.z} SD`;
    hero.style.fontSize = '';
  } else {
    hero.textContent = 'refused';
    hero.style.fontSize = '22px';
    $('#lTag').textContent = 'no between-player signal · league claim only';
  }
  $('#lNums').innerHTML = `
    <div class="ln"><div class="k micro">Tonight</div><div class="v fig">${m.value}</div>
      <div class="s meta">${m.metric}</div></div>
    <div class="ln league"><div class="k micro">League</div>
      <div class="v fig">${Math.round(m.league_pct)}%</div>
      <div class="s meta">beaten · norm ${m.expected}</div></div>
    <div class="ln"><div class="k micro">His norm</div>
      <div class="v fig">${m.season_mean ?? '—'}</div>
      <div class="s meta">${m.season_mean != null ? m.appearances + ' matches' : 'not supported'}</div></div>`;
  lo.classList.add('up');

  const chain = [
    ['Measured', `<code>${m.metric} = ${m.value}</code> as of ${m.minute}'`],
    ['League', `norm <code>${m.expected}</code>, beats <code>${Math.round(m.league_pct)}%</code>`],
  ];
  if (m.season_mean != null) {
    chain.push(['His season', `norm <code>${m.season_mean}</code> over <code>${m.appearances}</code> matches · <code>${m.z > 0 ? '+' : ''}${m.z} SD</code>`]);
    chain.push(['Why', m.diverges
      ? (m.above ? 'Ordinary against the league, clearly above his own level.'
                 : 'Ordinary against the league, well below his own level — only his history shows it.')
      : (m.above ? "Above his level and the league's." : 'Below his own level.')]);
  } else {
    chain.push(['Refused', 'No personal claim: this metric has no between-player signal.']);
  }
  chain.push(['Gate', m.grounded
    ? `every number verified · <code>${m.model}</code>` : 'fell back to template']);
  $('#sheet').innerHTML = `<h3>Why</h3>` +
    chain.map(([k, v]) => `<div class="step"><b>${k}</b><span>${v}</span></div>`).join('');

  document.querySelectorAll('.row').forEach((r, j) => {
    r.setAttribute('aria-current', j === i);
    if (j === i) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

function sync() {
  const mn = minuteNow();
  $('#clk').textContent = mn + "'";
  $('#fill').style.width = (clock / FULL * 100) + '%';
  document.querySelectorAll('.row').forEach((r, i) =>
    r.classList.toggle('fired', FEED.moments[i].minute <= mn));
  document.querySelectorAll('.pip').forEach((p, i) =>
    p.classList.toggle('hit', FEED.moments[i].minute <= mn));

  const due = FEED.moments.map((m, i) => [m.minute, i]).filter(([k]) => k <= mn);
  if (!due.length) { $('#lower').classList.remove('up'); $('#sheet').classList.remove('up'); idx = -1; return; }
  const want = due[due.length - 1][1];
  if (want !== idx) showMoment(want);
}

function play() {
  if (clock >= FULL) { clock = 0; idx = -1; }
  playing = true; last = performance.now();
  $('#play').textContent = '❚❚ Pause'; $('#live').classList.add('on');
}
function pause() {
  playing = false; $('#play').textContent = '▶ Play'; $('#live').classList.remove('on');
}

function setMode(next) {
  mode = next;
  $('#mAnalyst').setAttribute('aria-pressed', mode === 'analyst');
  $('#mFan').setAttribute('aria-pressed', mode === 'fan');
  $('#rail').classList.toggle('off', mode === 'fan');
  document.body.classList.toggle('analyst', mode === 'analyst');
  $('#why').classList.toggle('hide', mode === 'fan');
  if (mode === 'fan') { showWhy = false; $('#sheet').classList.remove('up'); }
}

fetch('feed.json').then(r => r.json()).then(d => {
  FEED = d;
  cv = $('#cv'); ctx = cv.getContext('2d');
  layout(); addEventListener('resize', layout);
  makeGrain();
  buildTurf();
  buildShadow();

  $('#hTag').textContent = d.match.home.short; $('#hG').textContent = d.match.home.goals;
  $('#aTag').textContent = d.match.away.short; $('#aG').textContent = d.match.away.goals;

  $('#timeline').innerHTML = d.moments.map((m, i) => `
    <button class="row"><div class="t"><span class="mn">${m.minute}'</span>
      <span class="nm">${m.player}</span>
      ${m.diverges ? `<span class="dt" style="background:${m.above ? 'var(--accent)' : 'var(--down)'}"></span>` : ''}
    </div><div class="mt">${m.metric} · ${m.value} vs ${m.season_mean ?? m.expected}</div></button>`).join('');
  document.querySelectorAll('.row').forEach((r, i) => r.onclick = () => {
    pause(); clock = d.moments[i].minute * 60 + 1; sync(); showMoment(i);
  });
  $('#track').innerHTML = `<div class="fill" id="fill"></div>` +
    d.moments.map(m => `<div class="pip" style="left:${m.minute * 60 / FULL * 100}%"></div>`).join('');

  $('#follow').innerHTML = d.follow.map((f, i) =>
    `<div class="item"><span class="r">${i + 1}</span><span>${f.player}</span>
     <span class="v">${f.score.toFixed(3)}</span></div>`).join('');
  $('#signal').innerHTML = d.signal.map(s =>
    `<div class="item"><span>${s.metric}</span>
     <span class="v ${s.personal ? 'yes' : 'no'}">${s.personal ? 'personal' : 'league only'}</span></div>`).join('');

  $('#play').onclick = () => playing ? pause() : play();
  $('#why').onclick = () => {
    showWhy = !showWhy;
    $('#sheet').classList.toggle('up', showWhy && idx >= 0);
    $('#lower').classList.toggle('hide', showWhy);
  };
  $('#spd').onclick = () => {
    SPEED = SPEEDS[(SPEEDS.indexOf(SPEED) + 1) % SPEEDS.length];
    TRAIL = SPEED * 2.4;
    $('#spd').innerHTML = SPEED + '&times;';
  };
  $('#wide').onclick = () => {
    wide = !wide;
    $('#wide').setAttribute('aria-pressed', wide);
    buildCam();
  };
  $('#snd').onclick = async () => {
    try {
      if (!AC) await initCrowd();
      if (sndOn) { await AC.suspend(); sndOn = false; }
      else { await AC.resume(); sndOn = true; }
    } catch (err) {
      // A failed fetch or decode must never wedge the button.
      sndOn = false; CROWD = null;
      if (AC) { try { AC.close(); } catch (e2) {} AC = null; }
    }
    $('#snd').setAttribute('aria-pressed', sndOn);
  };
  $('#mAnalyst').onclick = () => setMode('analyst');
  $('#mFan').onclick = () => setMode('fan');
  $('#track').onclick = e => {
    pause();
    const r = $('#track').getBoundingClientRect();
    clock = (e.clientX - r.left) / r.width * FULL; sync();
  };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  });
  setMode('analyst');

  // Open ON the claim, not at kickoff. Every competitor's demo loads at
  // 0-0 with an empty insight panel; the one thing this project exists
  // to say should be on screen before anyone touches a control.
  const centre = d.window && d.window.centre_minute != null
    ? d.window.centre_minute : d.moments[0].minute;
  let open = 0, bestGap = 1e9;
  d.moments.forEach((m, i) => {
    const gap = Math.abs(m.minute - centre) + (m.diverges ? 0 : 6);
    if (gap < bestGap) { bestGap = gap; open = i; }
  });
  BALL = buildBallTrack();
  clock = d.moments[open].minute * 60 + 1;
  camX = Math.max(28, Math.min(L - 28, ballAt(clock).x));
  sync(); showMoment(open);
  last = performance.now();
  requestAnimationFrame(frame);
}).catch(() => {
  document.body.innerHTML =
    '<div style="padding:40px;font:15px system-ui;color:#eef4fa">No feed. Run ' +
    '<code>python -m gegenpress feed</code>, then <code>python -m http.server -d docs 8000</code></div>';
});
</script>
</body>
</html>
