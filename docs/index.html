<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gegenpress — Studio</title>
<style>
  :root{
    --bg:#05080b; --ink:#eef4fa; --mute:#8d9bab; --dim:#56646f;
    --line:#1a242e; --panel:rgba(14,20,27,.82);
    --accent:#ffb020; --down:#ff5f5f; --home:#5aa9ff; --away:#ffb020;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ---------- */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column}
  .field{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.52) 100%)}

  /* ---------- broadcast bug ---------- */
  .bug{
    position:absolute;top:22px;left:24px;display:flex;align-items:center;gap:0;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
    box-shadow:0 10px 34px rgba(0,0,0,.55);
  }
  .bug .side{display:flex;align-items:center;gap:10px;padding:11px 15px}
  .bug .tag{font:700 12px/1 var(--mono);letter-spacing:.1em}
  .bug .h .tag{color:var(--home)} .bug .a .tag{color:var(--away)}
  .bug .g{font:700 21px/1 var(--mono)}
  .bug .clk{
    padding:11px 16px;border-left:1px solid var(--line);
    font:700 15px/1 var(--mono);color:var(--accent);min-width:62px;text-align:center;
  }
  .bug .live{
    display:flex;align-items:center;gap:6px;padding:11px 14px;
    border-left:1px solid var(--line);font:700 10px/1 inherit;letter-spacing:.14em;
    color:var(--down);opacity:.35;transition:opacity .3s;
  }
  .bug .live.on{opacity:1}
  .bug .live i{width:6px;height:6px;border-radius:50%;background:var(--down)}
  .bug .live.on i{animation:beat 1.5s infinite}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}

  .bug .mark{
    font:800 13px/1 var(--mono);letter-spacing:.06em;color:#05080b;
    background:var(--accent);padding:13px 12px;align-self:stretch;
    display:flex;align-items:center;
  }

  /* ---------- lower third ---------- */
  .lower{
    position:absolute;left:24px;right:24px;bottom:22px;
    transition:right .4s var(--ease);
    display:flex;gap:0;align-items:stretch;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:13px;overflow:hidden;
    box-shadow:0 18px 56px rgba(0,0,0,.66);
    transform:translateY(130%);opacity:0;pointer-events:none;
    transition:transform .5s var(--ease),opacity .4s;
  }
  .lower.up{transform:none;opacity:1;pointer-events:auto}
  .lower .bandL{width:4px;background:var(--accent)}
  .lower.dn .bandL{background:var(--down)}
  .lower .body{flex:1;padding:16px 20px;min-width:0}
  .ltop{display:flex;align-items:baseline;gap:11px;margin-bottom:5px;flex-wrap:wrap}
  .lname{font:650 21px/1.1 inherit;letter-spacing:-.015em}
  .lmeta{font-size:12.5px;color:var(--mute)}
  .ltag{
    font:700 9.5px/1 inherit;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);border:1px solid rgba(255,176,32,.35);
    background:rgba(255,176,32,.1);border-radius:999px;padding:5px 10px;
  }
  .lower.dn .ltag{color:var(--down);border-color:rgba(255,95,95,.35);background:rgba(255,95,95,.1)}
  .lsaid{font-size:15px;color:#dde6ef;margin-top:7px;max-width:72ch}

  .lnums{display:flex;border-left:1px solid var(--line)}
  .ln{padding:15px 22px;min-width:152px;border-right:1px solid var(--line)}
  .ln:last-child{border-right:0}
  .ln .k{font:700 9.5px/1 inherit;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-bottom:9px}
  .ln.form .k{color:var(--accent)}
  .lower.dn .ln.form .k{color:var(--down)}
  .ln .v{font:700 27px/1 var(--mono);letter-spacing:-.02em}
  .ln .s{font-size:11.5px;color:var(--mute);margin-top:6px}

  /* ---------- transport ---------- */
  .bar{
    display:flex;align-items:center;gap:13px;padding:12px 24px;
    background:#080c10;border-top:1px solid var(--line);
  }
  .btn{
    font:600 12px/1 inherit;letter-spacing:.05em;text-transform:uppercase;
    color:var(--mute);background:#111922;border:1px solid var(--line);
    padding:10px 16px;border-radius:8px;cursor:pointer;transition:.14s var(--ease);
    white-space:nowrap;
  }
  .btn:hover{color:var(--ink);border-color:#2b3744}
  .btn.p,.btn[aria-pressed=true]{color:#05080b;background:var(--accent);border-color:var(--accent)}
  .track{flex:1;height:6px;background:#111922;border:1px solid var(--line);
    border-radius:4px;position:relative;cursor:pointer}
  .track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);
    border-radius:4px;transition:width .12s linear}
  .track .pip{position:absolute;top:50%;width:3px;height:12px;margin-top:-6px;
    background:var(--dim);border-radius:2px;transition:.2s}
  .track .pip.hit{background:var(--accent);box-shadow:0 0 8px var(--accent)}

  /* ---------- rail ---------- */
  .rail{
    position:absolute;top:22px;right:26px;bottom:168px;width:296px;
    display:flex;flex-direction:column;gap:11px;overflow-y:auto;overflow-x:hidden;
    transition:transform .4s var(--ease),opacity .3s;
  }
  .rail.off{transform:translateX(118%);opacity:0;pointer-events:none}
  body.analyst .lower{right:346px}
  .rail::-webkit-scrollbar{width:0}
  #timeline{max-height:232px;overflow:auto}
  #follow,#signal{max-height:196px;overflow:auto}
  #follow::-webkit-scrollbar,#signal::-webkit-scrollbar{width:0}
  #timeline::-webkit-scrollbar{width:0}
  .card{background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .card h2{font:600 10px/1 inherit;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);padding:12px 15px;border-bottom:1px solid var(--line)}
  .row{display:block;width:100%;text-align:left;cursor:pointer;padding:10px 15px;
    border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;
    font:inherit;opacity:.3;transition:.18s var(--ease)}
  .row.fired{opacity:1}
  .row:hover{background:rgba(255,255,255,.035)}
  .row[aria-current=true]{background:rgba(255,176,32,.07);box-shadow:inset 3px 0 0 var(--accent)}
  .row .t{display:flex;align-items:baseline;gap:8px}
  .row .mn{font:600 10.5px var(--mono);color:var(--dim);min-width:28px}
  .row .nm{font-weight:600;font-size:13px}
  .row .dt{width:5px;height:5px;border-radius:50%;margin-left:auto}
  .row .mt{font-size:11.5px;color:var(--mute);padding-left:36px;margin-top:2px}
  .item{display:flex;align-items:center;gap:9px;padding:8px 15px;font-size:12.5px}
  .item .r{font:600 10px var(--mono);color:var(--dim);min-width:13px}
  .item .v{margin-left:auto;font:600 11px var(--mono);color:var(--home)}
  .item .yes{color:#3ddc84} .item .no{color:var(--dim)}

  /* ---------- why sheet ---------- */
  .sheet{
    position:absolute;left:24px;bottom:22px;width:min(640px,calc(100% - 360px));
    background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:13px;padding:17px 20px;box-shadow:0 18px 56px rgba(0,0,0,.66);
    transform:translateY(130%);opacity:0;pointer-events:none;
    transition:transform .45s var(--ease),opacity .35s;
  }
  .sheet.up{transform:none;opacity:1;pointer-events:auto}
  .sheet h3{font:600 10px/1 inherit;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin-bottom:12px}
  .step{display:flex;gap:11px;align-items:flex-start;font-size:13px;margin-bottom:8px}
  .step b{font:600 9.5px/1.7 var(--mono);color:var(--dim);min-width:66px;
    letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
  .step span{color:var(--mute)}
  .step code{font:12px var(--mono);color:var(--ink)}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="stage">
  <div class="field">
    <canvas id="cv"></canvas>
    <div class="vig"></div>

    <div class="bug">
      <div class="mark">GP</div>
      <div class="side h"><span class="tag" id="hTag">—</span><span class="g" id="hG">0</span></div>
      <div class="side a"><span class="g" id="aG">0</span><span class="tag" id="aTag">—</span></div>
      <div class="clk" id="clk">0'</div>
      <div class="live" id="live"><i></i>LIVE</div>
    </div>

    <div class="lower" id="lower">
      <div class="bandL"></div>
      <div class="body">
        <div class="ltop">
          <span class="lname" id="lName"></span>
          <span class="lmeta" id="lMeta"></span>
          <span class="ltag" id="lTag"></span>
        </div>
        <div class="lsaid" id="lSaid"></div>
      </div>
      <div class="lnums" id="lNums"></div>
    </div>

    <div class="sheet" id="sheet"></div>

    <div class="rail" id="rail">
      <section class="card"><h2>Moments</h2><div id="timeline"></div></section>
      <section class="card"><h2>Follow — lift over own norm</h2><div id="follow"></div></section>
      <section class="card"><h2>Personal claims allowed</h2><div id="signal"></div></section>
    </div>
  </div>

  <div class="bar">
    <button class="btn p" id="play">▶ Play</button>
    <button class="btn" id="why">Why</button>
    <button class="btn" id="spd">4&times;</button>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <button class="btn" id="mAnalyst" aria-pressed="true">Analyst</button>
    <button class="btn" id="mFan" aria-pressed="false">Fan</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const L = 105, W = 68, FULL = 5400;       // pitch metres, match seconds
let FEED, cv, ctx, DPR = 1, box = {};
let clock = 0, playing = false, last = 0, idx = -1, mode = 'analyst', showWhy = false;
const SPEEDS = [1, 4, 12];                // match-seconds per real second
let SPEED = 4;                            // 4x, what a tracking viewer uses
// Visible for ~0.75s of REAL time. TRAIL is in match-seconds and the
// clock runs at SPEED x, so this must scale with it or events flash
// past in milliseconds.
let TRAIL = SPEED * 2.4;

/* ---------- geometry ---------- */
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = r.width * DPR; cv.height = r.height * DPR;
  const pad = 54;
  const s = Math.min((r.width - pad * 2) / L, (r.height - pad * 2) / W);
  box = { s, ox: (r.width - L * s) / 2, oy: (r.height - W * s) / 2, w: r.width, h: r.height };
}
// Home attacks right, away attacks left. Source x is always from the
// possessing team's frame, so away events are mirrored.
const PX = (x, away) => box.ox + (away ? L - x : x) * box.s;
const PY = (y, away) => box.oy + (away ? W - y : y) * box.s;

/* ---------- pitch ---------- */
function drawPitch() {
  const g = ctx, s = box.s;
  g.save(); g.scale(DPR, DPR);
  const grd = g.createLinearGradient(0, box.oy, 0, box.oy + W * s);
  grd.addColorStop(0, '#10212b'); grd.addColorStop(.5, '#152a35'); grd.addColorStop(1, '#0f1e27');
  g.fillStyle = '#05080b'; g.fillRect(0, 0, box.w, box.h);
  g.fillStyle = grd; g.fillRect(box.ox, box.oy, L * s, W * s);

  // mown stripes
  g.fillStyle = 'rgba(255,255,255,.022)';
  for (let i = 0; i < 10; i += 2) g.fillRect(box.ox + i * L * s / 10, box.oy, L * s / 10, W * s);

  g.strokeStyle = 'rgba(205,230,250,.38)'; g.lineWidth = Math.max(1.1, s * .13);
  const R = (x, y, w, h) => g.strokeRect(box.ox + x * s, box.oy + y * s, w * s, h * s);
  R(0, 0, L, W);
  g.beginPath(); g.moveTo(box.ox + L / 2 * s, box.oy); g.lineTo(box.ox + L / 2 * s, box.oy + W * s); g.stroke();
  g.beginPath(); g.arc(box.ox + L / 2 * s, box.oy + W / 2 * s, 9.15 * s, 0, 7); g.stroke();
  g.beginPath(); g.arc(box.ox + L / 2 * s, box.oy + W / 2 * s, s * .35, 0, 7);
  g.fillStyle = 'rgba(190,215,235,.3)'; g.fill();
  R(0, (W - 40.3) / 2, 16.5, 40.3); R(L - 16.5, (W - 40.3) / 2, 16.5, 40.3);
  R(0, (W - 18.3) / 2, 5.5, 18.3); R(L - 5.5, (W - 18.3) / 2, 5.5, 18.3);
  g.restore();
}

/* ---------- live events ---------- */
function drawEvents() {
  const g = ctx, s = box.s;
  g.save(); g.scale(DPR, DPR); g.lineCap = 'round';
  const home = FEED.match.home.id;
  for (const e of FEED.stream) {
    const age = clock - e.t;
    if (age < 0 || age > TRAIL) continue;
    const a = Math.pow(1 - age / TRAIL, 1.7);          // fade out
    const grow = Math.min(1, age / .45);               // draw in
    const away = e.m !== home;
    const col = away ? '255,176,32' : '90,169,255';
    const x1 = PX(e.x, away), y1 = PY(e.y, away);

    if (e.k === 'pa' || e.k === 'ca') {
      const x2 = e.X != null ? PX(e.X, away) : x1, y2 = e.Y != null ? PY(e.Y, away) : y1;
      g.strokeStyle = e.f ? `rgba(255,95,95,${a * .3})` : `rgba(${col},${a * .4})`;
      g.lineWidth = (e.k === 'ca' ? 2.4 : 1.5);
      if (e.f) g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(x1, y1);
      g.lineTo(x1 + (x2 - x1) * grow, y1 + (y2 - y1) * grow); g.stroke();
      g.setLineDash([]);
      g.fillStyle = `rgba(${col},${a})`;
      g.beginPath(); g.arc(x1, y1, 2, 0, 7); g.fill();
    } else if (e.k === 'sh') {
      const gx = box.ox + (away ? 0 : L * s), gy = box.oy + W / 2 * s;
      g.strokeStyle = e.g ? `rgba(61,220,132,${a})` : `rgba(${col},${a * .8})`;
      g.lineWidth = 3;
      g.beginPath(); g.moveTo(x1, y1);
      g.lineTo(x1 + (gx - x1) * grow, y1 + (gy - y1) * grow); g.stroke();
      if (e.g) {
        g.strokeStyle = `rgba(61,220,132,${a * .9})`; g.lineWidth = 2;
        g.beginPath(); g.arc(x1, y1, (1 - a) * 34 + 6, 0, 7); g.stroke();
      }
    } else if (e.k === 're') {
      g.strokeStyle = `rgba(255,255,255,${a * .55})`; g.lineWidth = 1.4;
      g.beginPath(); g.arc(x1, y1, (1 - a) * 16 + 3, 0, 7); g.stroke();
    } else if (e.k === 'pr') {
      g.fillStyle = `rgba(255,95,95,${a * .32})`;
      g.beginPath(); g.arc(x1, y1, 2.6, 0, 7); g.fill();
    }
  }
  g.restore();
}

/* ---------- players and ball ---------- */
function drawPlayers() {
  const F = FEED.frames;
  if (!F || !F.n) return;
  const g = ctx, s = box.s;
  // Where we are between two sampled frames.
  const k = (clock - F.t0) / F.dt;
  const i = Math.max(0, Math.min(F.n - 1, Math.floor(k)));
  const j = Math.min(F.n - 1, i + 1);
  const raw = Math.max(0, Math.min(1, k - i));
  const f = raw * raw * (3 - 2 * raw);          // ease, so dots glide

  const lerp = (arr, a, b, o) => [
    arr[a * 22 + o] + (arr[b * 22 + o] - arr[a * 22 + o]) * f,
    arr[a * 22 + o + 1] + (arr[b * 22 + o + 1] - arr[a * 22 + o + 1]) * f,
  ];
  const bx = F.b[i * 2] + (F.b[j * 2] - F.b[i * 2]) * f;
  const by = F.b[i * 2 + 1] + (F.b[j * 2 + 1] - F.b[i * 2 + 1]) * f;

  g.save(); g.scale(DPR, DPR);
  const BX = box.ox + bx * s, BY = box.oy + by * s;
  const r = Math.max(5, s * .62);

  // Nearest player to the ball is carrying it: the frames hold
  // positions, not possession, and a ring beats shipping another field.
  let best = null, bestD = 1e9;
  for (const [arr, col] of [[F.h, '90,169,255'], [F.a, '255,176,32']]) {
    for (let p = 0; p < 11; p++) {
      const [px, py] = lerp(arr, i, j, p * 2);
      const d = Math.hypot(px - bx, py - by);
      if (d < bestD) {
        bestD = d;
        const side = arr === F.h ? 'home' : 'away';
        best = [px, py, col, FEED.lineups ? FEED.lineups[side][p] : null];
      }
    }
  }

  const back = Math.max(0, i - 1);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const [arr, col, side] of [[F.h, '90,169,255', 'home'], [F.a, '255,176,32', 'away']]) {
    const xi = FEED.lineups ? FEED.lineups[side] : null;
    for (let p = 0; p < 11; p++) {
      const [px, py] = lerp(arr, i, j, p * 2);
      const X = box.ox + px * s, Y = box.oy + py * s;

      // Where he has come from: direction of travel reads as motion
      // even in a still frame, which dots alone never do.
      const vx = px - arr[back * 22 + p * 2], vy = py - arr[back * 22 + p * 2 + 1];
      const sp = Math.hypot(vx, vy);
      // Only show a tail when he is actually moving, and keep it short.
      if (sp > 1.1) {
        const k2 = Math.min(1, sp / 9);
        g.beginPath();
        g.moveTo(X - vx * s * .42, Y - vy * s * .42); g.lineTo(X, Y);
        g.strokeStyle = `rgba(${col},${.12 + k2 * .26})`;
        g.lineWidth = r * .78; g.lineCap = 'round'; g.stroke();
      }

      g.beginPath(); g.arc(X, Y + r * .22, r, 0, 7);
      g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();               // grounding shadow
      g.beginPath(); g.arc(X, Y, r, 0, 7);
      g.fillStyle = `rgb(${col})`; g.fill();
      g.lineWidth = 1.1; g.strokeStyle = 'rgba(5,8,11,.9)'; g.stroke();

      if (xi && r > 7) {
        g.fillStyle = side === 'home' ? '#06101c' : '#1a1203';
        g.font = `700 ${Math.round(r * 1.05)}px ui-monospace,monospace`;
        g.fillText(String(xi[p].n), X, Y + .5);
      }
    }
  }
  if (best && bestD < 4) {
    const BXc = box.ox + best[0] * s, BYc = box.oy + best[1] * s;
    g.beginPath(); g.arc(BXc, BYc, r + 5, 0, 7);
    g.strokeStyle = `rgba(${best[2]},.9)`; g.lineWidth = 2; g.stroke();
    if (best[3]) {
      const label = `${best[3].n}  ${best[3].last}`;
      g.font = `600 ${Math.max(11, Math.round(r * .95))}px -apple-system,system-ui,sans-serif`;
      const w = g.measureText(label).width + 14;
      g.fillStyle = 'rgba(5,8,11,.82)';
      g.beginPath(); g.roundRect(BXc - w / 2, BYc - r - 26, w, 19, 5); g.fill();
      g.fillStyle = '#eef4fa';
      g.fillText(label, BXc, BYc - r - 16);
    }
  }

  g.beginPath(); g.arc(BX, BY, r * .55, 0, 7);
  g.fillStyle = '#fff'; g.shadowColor = 'rgba(255,255,255,.85)';
  g.shadowBlur = 11; g.fill(); g.shadowBlur = 0;
  g.restore();
}

function frame(now) {
  if (playing) {
    const dt = Math.min(.1, (now - last) / 1000);
    clock = Math.min(FULL, clock + dt * SPEED);
    if (clock >= FULL) pause();
    sync();
  }
  last = now;
  drawPitch(); drawEvents(); drawPlayers();
  requestAnimationFrame(frame);
}

/* ---------- moments ---------- */
function minuteNow() { return Math.floor(clock / 60); }

function showMoment(i) {
  const m = FEED.moments[i];
  if (!m) return;
  idx = i;
  const lo = $('#lower');
  lo.classList.toggle('dn', !m.above);
  $('#lName').textContent = m.player;
  $('#lMeta').textContent = `${m.club} · ${m.minute}' · ${m.metric}`;
  $('#lTag').textContent = m.diverges
    ? (m.above ? 'above his level · ordinary league-wide'
               : 'below his level · ordinary league-wide')
    : (m.above ? "above his level and the league's" : 'below his own level');
  $('#lSaid').textContent = m.text;

  const form = m.season_mean != null
    ? `<div class="ln form"><div class="k">Form line</div>
         <div class="v">${m.z > 0 ? '+' : ''}${m.z} SD</div>
         <div class="s">his norm ${m.season_mean} · ${m.appearances} matches</div></div>`
    : `<div class="ln"><div class="k">Form line</div>
         <div class="v" style="font-size:15px;color:var(--dim)">not supported</div>
         <div class="s">no between-player signal</div></div>`;
  $('#lNums').innerHTML = `
    <div class="ln"><div class="k">Tonight</div><div class="v">${m.value}</div>
      <div class="s">${m.metric}</div></div>
    <div class="ln"><div class="k">League</div><div class="v">${Math.round(m.league_pct)}%</div>
      <div class="s">beaten · norm ${m.expected}</div></div>
    ${form}`;
  lo.classList.add('up');

  const chain = [
    ['Measured', `<code>${m.metric} = ${m.value}</code> as of ${m.minute}'`],
    ['League', `norm <code>${m.expected}</code>, beats <code>${Math.round(m.league_pct)}%</code>`],
  ];
  if (m.season_mean != null) {
    chain.push(['His season', `norm <code>${m.season_mean}</code> over <code>${m.appearances}</code> matches · <code>${m.z > 0 ? '+' : ''}${m.z} SD</code>`]);
    chain.push(['Why', m.diverges
      ? (m.above ? 'Ordinary against the league, clearly above his own level.'
                 : 'Ordinary against the league, well below his own level — only his history shows it.')
      : (m.above ? "Above his level and the league's." : 'Below his own level.')]);
  } else {
    chain.push(['Refused', 'No personal claim: this metric has no between-player signal.']);
  }
  chain.push(['Gate', m.grounded
    ? `every number verified · <code>${m.model}</code>` : 'fell back to template']);
  $('#sheet').innerHTML = `<h3>Why</h3>` +
    chain.map(([k, v]) => `<div class="step"><b>${k}</b><span>${v}</span></div>`).join('');

  document.querySelectorAll('.row').forEach((r, j) => {
    r.setAttribute('aria-current', j === i);
    if (j === i) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

function sync() {
  const mn = minuteNow();
  $('#clk').textContent = mn + "'";
  $('#fill').style.width = (clock / FULL * 100) + '%';
  document.querySelectorAll('.row').forEach((r, i) =>
    r.classList.toggle('fired', FEED.moments[i].minute <= mn));
  document.querySelectorAll('.pip').forEach((p, i) =>
    p.classList.toggle('hit', FEED.moments[i].minute <= mn));

  const due = FEED.moments.map((m, i) => [m.minute, i]).filter(([k]) => k <= mn);
  if (!due.length) { $('#lower').classList.remove('up'); $('#sheet').classList.remove('up'); idx = -1; return; }
  const want = due[due.length - 1][1];
  if (want !== idx) showMoment(want);
}

function play() {
  if (clock >= FULL) { clock = 0; idx = -1; }
  playing = true; last = performance.now();
  $('#play').textContent = '❚❚ Pause'; $('#live').classList.add('on');
}
function pause() {
  playing = false; $('#play').textContent = '▶ Play'; $('#live').classList.remove('on');
}

function setMode(next) {
  mode = next;
  $('#mAnalyst').setAttribute('aria-pressed', mode === 'analyst');
  $('#mFan').setAttribute('aria-pressed', mode === 'fan');
  // Fan mode is the match and the claim, nothing else.
  $('#rail').classList.toggle('off', mode === 'fan');
  document.body.classList.toggle('analyst', mode === 'analyst');
  $('#why').classList.toggle('hide', mode === 'fan');
  if (mode === 'fan') { showWhy = false; $('#sheet').classList.remove('up'); }
}

fetch('feed.json').then(r => r.json()).then(d => {
  FEED = d;
  cv = $('#cv'); ctx = cv.getContext('2d');
  layout(); addEventListener('resize', layout);

  $('#hTag').textContent = d.match.home.short; $('#hG').textContent = d.match.home.goals;
  $('#aTag').textContent = d.match.away.short; $('#aG').textContent = d.match.away.goals;

  $('#timeline').innerHTML = d.moments.map((m, i) => `
    <button class="row"><div class="t"><span class="mn">${m.minute}'</span>
      <span class="nm">${m.player}</span>
      ${m.diverges ? `<span class="dt" style="background:${m.above ? 'var(--accent)' : 'var(--down)'}"></span>` : ''}
    </div><div class="mt">${m.metric} · ${m.value} vs ${m.season_mean ?? m.expected}</div></button>`).join('');
  document.querySelectorAll('.row').forEach((r, i) => r.onclick = () => {
    pause(); clock = d.moments[i].minute * 60 + 1; sync(); showMoment(i);
  });
  $('#track').innerHTML = `<div class="fill" id="fill"></div>` +
    d.moments.map(m => `<div class="pip" style="left:${m.minute * 60 / FULL * 100}%"></div>`).join('');

  $('#follow').innerHTML = d.follow.map((f, i) =>
    `<div class="item"><span class="r">${i + 1}</span><span>${f.player}</span>
     <span class="v">${f.score.toFixed(3)}</span></div>`).join('');
  $('#signal').innerHTML = d.signal.map(s =>
    `<div class="item"><span>${s.metric}</span>
     <span class="v ${s.personal ? 'yes' : 'no'}">${s.personal ? 'personal' : 'league only'}</span></div>`).join('');

  $('#play').onclick = () => playing ? pause() : play();
  $('#why').onclick = () => {
    showWhy = !showWhy;
    $('#sheet').classList.toggle('up', showWhy && idx >= 0);
    $('#lower').classList.toggle('hide', showWhy);
  };
  $('#spd').onclick = () => {
    SPEED = SPEEDS[(SPEEDS.indexOf(SPEED) + 1) % SPEEDS.length];
    TRAIL = SPEED * 2.4;
    $('#spd').innerHTML = SPEED + '&times;';
  };
  $('#mAnalyst').onclick = () => setMode('analyst');
  $('#mFan').onclick = () => setMode('fan');
  $('#track').onclick = e => {
    pause();
    const r = $('#track').getBoundingClientRect();
    clock = (e.clientX - r.left) / r.width * FULL; sync();
  };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  });
  setMode('analyst');
  clock = Math.max(0, d.moments[0].minute * 60 - 50);
  sync();
  requestAnimationFrame(frame);
}).catch(() => {
  document.body.innerHTML =
    '<div style="padding:40px;font:15px system-ui;color:#eef4fa">No feed. Run ' +
    '<code>python -m gegenpress feed</code>, then <code>python -m http.server -d docs 8000</code></div>';
});
</script>
</body>
</html>
