  // ball at the far end, and no focal length holds both. Pretending
  // otherwise is how a follow-cam loses its man silently; point at him
  // from the edge instead, with how far away he is.
  // The visible pitch ends where the rail begins. A chevron at the
  // canvas edge sat under the rail, pointing at nobody.
  const railW = document.body.classList.contains('analyst') ? $('#rail').offsetWidth : 0;
  const m = 54, right_edge = VW - railW;
  if (foot[0] < m || foot[0] > right_edge - m) {
    const right = foot[0] > right_edge - m;
    const ex = right ? right_edge - m : m;
    const ey = Math.max(m, Math.min(VH - 150, foot[1]));
    g.fillStyle = `rgba(${who.rgb},.92)`;
    g.beginPath();
    g.moveTo(ex + (right ? 16 : -16), ey);
    g.lineTo(ex + (right ? -8 : 8), ey - 11);
    g.lineTo(ex + (right ? -8 : 8), ey + 11);
    g.closePath(); g.fill();
    const bb2 = ballAt(clock);
    const away = `${label}  ${Math.round(Math.hypot(fx - bb2.x, fy - bb2.y))}m`;
    g.font = '700 12px "Archivo Variable",system-ui,sans-serif';
    const aw = g.measureText(away).width + 16;
    g.fillStyle = who.hex;
    g.fillRect(ex + (right ? -8 - aw : 8), ey - 32, aw, 20);
    g.fillStyle = who.ink;
    g.fillText(away, ex + (right ? -8 - aw / 2 : 8 + aw / 2), ey - 22);
    g.restore();
    return;
  }

  const fs = Math.max(11, Math.min(14, h * .3)) * TS(), BH = Math.round(21 * TS()), BT = Math.round(10 * TS());
  g.font = `700 ${fs}px "Archivo Variable",system-ui,sans-serif`;
  const ty = foot[1] - h - 30 * TS();
  const nw = g.measureText(label).width + 16;
  const sw = who.stat ? g.measureText(who.stat).width + 14 : 0;
  // Live: his figure tonight including every touch that has landed by
  // now. Appears only once a touch has landed AFTER the claim's minute,
  // so at the opening frame the tag says exactly what the strap says.
  let liveTxt = null;
  if (who.touches && who.claimN != null) {
    const landed = who.touches.filter(e => e.t != null && e.t <= clock);
    if (landed.length > who.claimN) {
      const mean = landed.reduce((s, e) => s + e.value, 0) / landed.length;
      liveTxt = `${T('live_now')} ${mean.toFixed(1)}${who.unit}`;
    }
  }
  const lw = liveTxt ? g.measureText(liveTxt).width + 14 : 0;
  // And how far he has run, off his own figure: the one number on the tag
  // that moves whenever he does.
  const kmTxt = `${(metresRun(who.side, who.p, clock) / 1000).toFixed(2)} ${T('st_km')}`;
  const kw = g.measureText(kmTxt).width + 14;
  const vr0 = VW - (document.body.classList.contains('analyst') ? ($('#rail')?.offsetWidth || 0) : 0);
  const cxT = Math.max((nw + sw + lw + kw) / 2 + 8, Math.min(vr0 - (nw + sw + lw + kw) / 2 - 8, foot[0]));
  const x0 = cxT - (nw + sw + lw + kw) / 2;
  // Name on the chrome's ink, the figure on the verdict colour: the same
  // two-tone the strap uses, so the tag and the strap read as one graphic.
  // Padded well past the tag itself: two tags that touch read as one
  // stacked label, which is no better than two that overlap.
  SUBJ_TAG = { x: x0 - 14, y: ty - BT - 16, w: nw + sw + lw + kw + 28, h: BH + 32 };
  g.restore();
  // The ring lives on the grass, under the players' feet. The tag is a
  // broadcast graphic and sits over everyone -- a name half-hidden by a
  // defender's shoulder is a name nobody reads -- so it paints after
  // the people, in the overlay pass.
  const font = g.font;
  OVERLAY.push(() => {
    g.save(); g.globalAlpha = ease; g.font = font;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#1C0423';
    g.fillRect(x0, ty - BT, nw, BH);
    g.fillStyle = who.hex;
    g.fillRect(x0, ty - BT, 3, BH);
    if (who.stat) g.fillRect(x0 + nw, ty - BT, sw, BH);
    g.fillStyle = '#fff';
    g.fillText(label, x0 + 1.5 + nw / 2, ty + .5);
    if (who.stat) { g.fillStyle = who.ink; g.fillText(who.stat, x0 + nw + sw / 2, ty + .5); }
    if (liveTxt) {
      g.fillStyle = '#2A0733'; g.fillRect(x0 + nw + sw, ty - BT, lw, BH);
      g.fillStyle = '#fff'; g.fillText(liveTxt, x0 + nw + sw + lw / 2, ty + .5);
    }
    g.fillStyle = '#140219'; g.fillRect(x0 + nw + sw + lw, ty - BT, kw, BH);
    g.fillStyle = 'rgba(255,255,255,.78)'; g.fillText(kmTxt, x0 + nw + sw + lw + kw / 2, ty + .5);
    g.restore();
  });
}

/* Pops: the figure of a touch that just landed, rising from where the
   ball was played. Drawn after the people, because a figure that rises
   from behind the passer is a figure the viewer never sees. */
let OVERLAY = [], CARRIER_TAG = null;
function drawGoal() {
  if (!GOAL) return;
  const g = ctx, age = clock - GOAL.t;
  if (age < 0 || age > 4) return;
  let x = GOAL.x, y = GOAL.y, man = null;
  if (GOAL.p != null) {
    [x, y] = at(GOAL.side === 'home' ? FEED.frames.h : FEED.frames.a, 22, GOAL.p * 2, clock);
    man = FEED.lineups[GOAL.side][GOAL.p];
  }
  const k = ACC.motion ? 1 : Math.min(1, age / .6);
  const foot = P(x, y, 0), h = foot[1] - P(x, y, 1.84)[1];
  g.save();
  g.strokeStyle = `rgba(0,255,133,${.9 * (1 - Math.min(1, age / 4))})`;
  g.lineWidth = Math.max(2, .2 * mpp(y));
  poly(g, ring(x, y, 1.4 + 2.2 * k, 0, Math.PI * 2, 32), true); g.stroke();
  const lbl = man ? `${T('goal')}  ·  ${man.n} ${man.last.toUpperCase()}` : `${T('goal')}  ·  ${GOAL.club}`;
  g.font = `800 ${Math.max(12, Math.min(16, h * .34)) * TS()}px "Archivo Variable",system-ui,sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const tw2 = g.measureText(lbl).width + 20;
  let ty2 = foot[1] - h - 36;
  // Over every other tag on him, never under one.
  for (const r of [SUBJ_TAG, CARRIER_TAG])
    if (r && foot[0] + tw2 / 2 > r.x && foot[0] - tw2 / 2 < r.x + r.w && ty2 + 13 > r.y && ty2 - 13 < r.y + r.h)
      ty2 = Math.min(ty2, r.y - 4);
  // A goal is often scored at the edge of the frame. The tag slides
  // inward rather than being cut: it may sit beside him, never off him.
  const vr = VW - (document.body.classList.contains('analyst') ? ($('#rail')?.offsetWidth || 0) : 0);
  const tx2 = Math.max(tw2 / 2 + 8, Math.min(vr - tw2 / 2 - 8, foot[0]));
  g.fillStyle = '#00FF85'; g.fillRect(tx2 - tw2 / 2, ty2 - 12, tw2, 25);
  g.fillStyle = '#0B0010'; g.fillText(lbl, tx2, ty2 + .5);
  g.restore();
}

function drawOverlay() {
  for (const fn of OVERLAY) fn();
  OVERLAY = [];
  drawGoal();
  if (!POPS.length) return;
  const g = ctx, who = SUBJ;
  g.save();
  g.font = '800 14px "Archivo Variable",system-ui,sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const pp of POPS) {
    const life = pp.big ? 1.8 : 1.4, age = clock - pp.t;
    if (age < 0 || age > life) continue;
    const k = age / life, ease = 1 - Math.pow(1 - k, 2);
    // Starts above the head of whoever stood there, not at his feet --
    // and above any tag over him, so the figure rises from the tag
    // instead of through it.
    const [px] = P(pp.x, pp.y, 0);
    let base = P(pp.x, pp.y, 1.84)[1] - 14;
    for (const r of [SUBJ_TAG, CARRIER_TAG]) {
      if (r && px > r.x && px < r.x + r.w && base > r.y - 6 && base < r.y + r.h + 20)
        base = Math.min(base, r.y - 4);
    }
    // The subject's figures are the story and get the full graphic; every
    // other man's are small and quick, so twenty-two players touching the
    // ball reads as a match and not as a slot machine.
    const fs = (pp.big ? 14 + 6 * (1 - ease) : 11 + 2 * (1 - ease)) * TS();
    g.globalAlpha = (1 - k) * (pp.big ? 1 : .85);
    g.font = `${pp.big ? 800 : 700} ${fs}px "Archivo Variable",system-ui,sans-serif`;
    const w = g.measureText(pp.text).width + (pp.big ? 14 : 10);
    const hh = (pp.big ? 22 : 17) * TS();
    const yy = base - (ACC.motion ? 0 : (pp.big ? 30 : 20) * ease);   // reduce motion: fade in place
    g.fillStyle = `rgba(${pp.rgb},.95)`; g.fillRect(px - w / 2, yy - hh / 2, w, hh);
    g.fillStyle = '#0B0010'; g.fillText(pp.text, px, yy + .5);
  }
  g.restore();
}

/* ================== people ==================
   A numbered circle is a counter. What makes it a player is height: a
   figure that stands on the grass, casts a shadow, faces where it is
   running and leans into a turn. */
const KIT = {
  home: { shirt: '#2f7fe0', trim: '#8cc6ff', short: '#16294b', sock: '#23548f', ink: '#eaf4ff' },
  away: { shirt: '#eca322', trim: '#ffdc96', short: '#3d2c0c', sock: '#9c6b12', ink: '#2a1d04' },
};
const SKIN = '#434b55', LEG = '#333a44';
const STRIDE = 1.75;                 // metres per half gait cycle
const phase = { home: new Float32Array(11), away: new Float32Array(11) };
const facing = { home: new Float32Array(11), away: new Float32Array(11) };

let SHADOW = null;
function buildShadow() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const gl = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gl.addColorStop(0, 'rgba(0,0,0,.55)');
  gl.addColorStop(.42, 'rgba(0,0,0,.33)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gl;
  x.beginPath(); x.arc(32, 32, 32, 0, 7); x.fill();
  SHADOW = c;
}

/* Catmull-Rom through the 1.5s samples. Straight-line interpolation
   renders a smooth run as a dog-leg at every sample boundary. */
function cr(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return .5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2
    + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
function at(arr, stride, off, t) {
  const F = FEED.frames;
  const k = (t - F.t0) / F.dt;
  const i = Math.max(0, Math.min(F.n - 1, Math.floor(k)));
  const u = Math.max(0, Math.min(1, k - i));
  const a = Math.max(0, i - 1), b = Math.min(F.n - 1, i + 1), c = Math.min(F.n - 1, i + 2);
  return [
    cr(arr[a * stride + off], arr[i * stride + off], arr[b * stride + off], arr[c * stride + off], u),
    cr(arr[a * stride + off + 1], arr[i * stride + off + 1], arr[b * stride + off + 1], arr[c * stride + off + 1], u),
  ];
}

/* One footballer, drawn in body-height units from the feet up.
   The silhouette is the whole job at this size: a head bump, narrow
   shoulders and -- the part that matters -- daylight between two legs.
   A solid tapered body over a dark ellipse is a chess pawn, which is
   exactly what the first version of this looked like. */
function figure(g, h, kit, ph, front, profile, num, lean, gait) {
  const sp = Math.sin(ph) * gait;                // gait=0 -> feet together
  const sw = .31 * (.62 + .38 * front);          // wide head-on, narrow in profile
  const sx = .155 * profile, sy = .038 * front;  // stride reads in x, foreshortens in y
  const stance = .048;                           // feet apart even at rest
  const HIP = -.44, WAIST = -.57, SHOULDER = -.80;
  const bob = Math.abs(Math.cos(ph)) * .02 * gait;   // rises mid-stride

  g.save();
  g.rotate(lean); g.scale(h, h);
  g.lineCap = 'round'; g.lineJoin = 'round';

  // Legs with mass: a thigh wider than its calf, bent at the knee, a
  // muted kit sock on the shin. Thread-width legs under a filled torso
  // were most of why the figures read as having no body.
  const leg = (dir) => {
    const hx = dir * stance, fx = dir * stance + sp * dir * sx;
    const fy = -Math.max(0, sp * dir) * .07 + sp * dir * sy;
    const kx = (hx + fx) / 2 + sp * dir * sx * .45;
    const ky = (HIP + fy) / 2 - .02;
    g.strokeStyle = LEG; g.lineWidth = .088;                      // thigh
    g.beginPath(); g.moveTo(hx, HIP + .03); g.lineTo(kx, ky); g.stroke();
    g.lineWidth = .064;                                           // calf
    g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
    g.strokeStyle = kit.sock; g.lineWidth = .066;                 // sock
    g.beginPath();
    g.moveTo(kx + (fx - kx) * .45, ky + (fy - ky) * .45); g.lineTo(fx, fy); g.stroke();
  };
  leg(-1); leg(1);

  // Everything above the legs bobs with the stride: highest as the legs
  // pass each other, lowest at footstrike. Up is negative here.
  g.translate(0, -bob);

  // One connected silhouette, shoulders through hips. A shirt triangle
  // floating above a separate shorts box reads as parts, not a person;
  // shirt and shorts here are two fills of the same body.
  const body = () => {
    g.beginPath();
    g.moveTo(-sw / 2, SHOULDER); g.lineTo(sw / 2, SHOULDER);
    g.lineTo(sw * .43, WAIST);
    g.lineTo(sw * .47, HIP - .015); g.lineTo(-sw * .47, HIP - .015);
    g.lineTo(-sw * .43, WAIST);
    g.closePath();
  };
  g.fillStyle = kit.short; body(); g.fill();
  g.save(); body(); g.clip();
  g.fillStyle = kit.shirt;
  g.fillRect(-sw, SHOULDER - .02, sw * 2, WAIST - SHOULDER + .02);
  g.fillStyle = kit.trim;                        // centre stripe
  g.fillRect(-sw * .062, SHOULDER, sw * .124, WAIST - SHOULDER);
  g.restore();
  body(); g.strokeStyle = 'rgba(4,8,11,.42)'; g.lineWidth = .02; g.stroke();

  // arms swing against the legs, close to the body
  g.strokeStyle = kit.shirt; g.lineWidth = .06;
  g.beginPath(); g.moveTo(-sw * .46, SHOULDER + .035); g.lineTo(-sw * .52 + sp * sx * .45, WAIST + .01); g.stroke();
  g.beginPath(); g.moveTo(sw * .46, SHOULDER + .035); g.lineTo(sw * .52 - sp * sx * .45, WAIST + .01); g.stroke();

  if (num != null) {
    g.fillStyle = kit.ink;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 .15px "Archivo Variable",system-ui,sans-serif';
    g.fillText(num, 0, SHOULDER + .105);
  }

  // neck, then head -- without the neck the head floats like a pinhead
  g.fillStyle = SKIN;
  g.fillRect(-.036, SHOULDER - .05, .072, .06);
  g.beginPath(); g.arc(0, -.9, .078, 0, 7); g.fill();
  g.restore();
}

function drawPeople() {
  CARRIER_TAG = null;
  const F = FEED.frames;
  if (!F || !F.n) return;
  const g = ctx;
  const back = Math.max(F.t0, clock - .22);
  const b = ballAt(clock);
  let bx = b.x, by = b.y;

  const cast = [];
  let carry = null, carryD = 1e9;
  for (const side of ['home', 'away']) {
    const arr = side === 'home' ? F.h : F.a;
    const kit = KIT[side];
    const xi = FEED.lineups ? FEED.lineups[side] : null;
    for (let p = 0; p < 11; p++) {
      const [x, y] = at(arr, 22, p * 2, clock);
      const [px, py] = at(arr, 22, p * 2, back);
      const vx = (x - px) / .22, vy = (y - py) / .22;
      const sp = Math.hypot(vx, vy);
      const d = Math.hypot(x - bx, y - by);
      const rec = { side, p, x, y, vx, vy, sp, kit, man: xi ? xi[p] : null };
      if (d < carryD) { carryD = d; carry = rec; }
      cast.push(rec);
    }
  }

  // A settled ball belongs at somebody's feet. The track puts it where
  // the events say; the nearest player is the man in possession, so the
  // ball is drawn ON him, leading his run slightly -- which is what
  // separates "he has the ball" from "a ball is near him". The blend
  // ramps over the first half second so control is gathered, not
  // teleported.
  if (b.dwell && carry && carryD < 2.4 && carry.sp !== undefined) {
    const w = Math.min(1, b.age / .5) * .9;
    const lead = Math.max(.1, Math.min(.45, carry.sp * .09));
    const tx = carry.x + (carry.sp > .3 ? carry.vx / carry.sp * lead : 0);
    const ty = carry.y + (carry.sp > .3 ? carry.vy / carry.sp * lead : 0);
    bx += (tx - bx) * w; by += (ty - by) * w;
  }

  // The RENDERED ball chases the model ball through a short lag. This is
  // what joins the pieces into one movement: the kick departs from where
  // the ball actually was at the passer's feet (not from wherever the
  // event log rounded it to), and both ends of a flight ease instead of
  // starting and stopping dead. A restart or a seek snaps -- those are
  // cuts, and smoothing across a cut would draw the very streak the cut
  // exists to avoid.
  if (!VISB || Math.hypot(bx - VISB.x, by - VISB.y) > 20
      || Math.abs(clock - VISB.t) > 5) {
    VISB = { x: bx, y: by, t: clock };
  } else {
    // The lag is constant in MATCH time, not wall time, so a pass keeps
    // the same shape at 1x and 12x instead of smearing as playback
    // speeds up.
    const kk = 1 - Math.exp(-DT * SPEED / .09);
    VISB.x += (bx - VISB.x) * kk;
    VISB.y += (by - VISB.y) * kk;
    VISB.t = clock;
  }
  bx = VISB.x; by = VISB.y;

  // Whose name is on screen. Assigned on possession, kept through the
  // next pass, released a second after the ball has left him.
  if (Math.abs(clock - LABEL_T) > 5) LABEL = null;
  if (b.dwell && carry && carryD < 3.5 && carry.man) {
    const isSubj = SUBJ && carry.side === SUBJ.side && carry.p === SUBJ.p;
    // The subject's own tag speaks for him; a second tag on the man who
    // just passed to him would stack on top of it.
    if (isSubj) LABEL = null; else { LABEL = { side: carry.side, p: carry.p }; LABEL_T = clock; }
  } else if (LABEL && clock - LABEL_T > 1.0) {
    LABEL = null;
  }

  // Ground marker under the man on the ball: a broadcast spotlight reads
  // far better than a ring round a dot, and survives the perspective.
  // Only while the ball is in someone's possession -- a ring that chases
  // a pass mid-flight flickers across whoever it overtakes.
  const carrierIsSubject = SUBJ && carry && carry.side === SUBJ.side && carry.p === SUBJ.p;
  if (b.dwell && carry && carryD < 3.5 && !carrierIsSubject) {
    g.strokeStyle = carry.side === 'home'
      ? 'rgba(90,169,255,.85)' : 'rgba(255,176,32,.85)';
    g.lineWidth = Math.max(1.4, .1 * mpp(carry.y));
    poly(g, ring(carry.x, carry.y, 1.25, 0, Math.PI * 2, 26), true); g.stroke();
  }

  // Ball sorted in with the players so it can be occluded.
  cast.push({ ball: true, x: bx, y: by, z: b.z });
  cast.sort((a, b) => (b.y + RIG.back) - (a.y + RIG.back));   // far first

  for (const r of cast) {
    const foot = P(r.x, r.y, 0);
    const k = mpp(r.y);

    if (r.ball) {
      const rad = Math.max(2.4, .2 * k);
      // Shadow on the turf whatever the height; a lofted ball reads as
      // lofted because the shadow stays down while the ball does not.
      g.fillStyle = 'rgba(0,0,0,.4)';
      g.beginPath();
      g.ellipse(foot[0], foot[1], rad * (1.2 + r.z * .05), rad * .42, 0, 0, 7);
      g.fill();
      const pos = P(r.x, r.y, r.z + .11);
      g.beginPath(); g.arc(pos[0], pos[1], rad, 0, 7);
      g.fillStyle = '#fff'; g.shadowColor = 'rgba(255,255,255,.8)';
      g.shadowBlur = 9; g.fill(); g.shadowBlur = 0;
      // A dark rim so it stays a ball when it crosses a white line.
      g.lineWidth = Math.max(.8, rad * .28); g.strokeStyle = 'rgba(10,8,14,.75)';
      g.stroke();
      continue;
    }

    const h = foot[1] - P(r.x, r.y, 1.84)[1];
    if (h < 4) continue;
    const front = r.sp > .4 ? Math.min(1, Math.abs(r.vy) / r.sp) : .5;
    const profile = r.sp > .4 ? Math.min(1, Math.abs(r.vx) / r.sp) : .4;

    // gait advances with distance covered, but capped: at 12x a true
    // cycle is a strobe, and legs that blur read as noise.
    const ph = phase[r.side];
    ph[r.p] += r.sp * GAIT / STRIDE * Math.PI;
    const lean = Math.max(-.16, Math.min(.16, r.vx / 9 * .15));

    // Shadow: soft and close. A flat dark ellipse under the feet is a
    // pedestal, and a figure on a pedestal is a chess piece however well
    // the figure itself is drawn.
    // One pre-rendered soft shadow, scaled per player. Building a radial
    // gradient per player per frame was pure waste: the shadow never
    // changes, only its size does.
    const sr = Math.max(5, .95 * k);
    g.drawImage(SHADOW, foot[0] - sr, foot[1] + Math.max(.5, .06 * k) - sr * .3,
      sr * 2, sr * .6);

    g.save(); g.translate(foot[0], foot[1]);
    figure(g, h, r.kit, ph[r.p], front, profile,
      h > 42 && r.man ? String(r.man.n) : null, lean,
      Math.min(1, r.sp / 3.4));          // stride grows with pace, so a
    g.restore();                         // standing player stands still

    // Name the man on the ball, as a broadcast would -- and as a
    // broadcast would, only once he has it. A tag that follows the
    // nearest man to a ball in flight hops across everyone it overtakes.
    // A goal names its scorer, over everything else, for four seconds.
    const subj = SUBJ && r.side === SUBJ.side && r.p === SUBJ.p;
    if (!subj && LABEL && r.side === LABEL.side && r.p === LABEL.p && r.man) {
      // Name, then what he has done tonight. The middle chip is whichever
      // count his last touch moved -- a pass ticks his passes, winning it
      // back ticks that -- and it lights in his kit for the second it
      // changes. The last chip is distance, off his own figure's path, so
      // it is running while he is.
      const key = `${r.side}${r.p}`, fl = FLASH[key];
      const kind = fl ? fl.k : 'pa';
      const n = statsAt(r.side, r.p, clock)[kind];
      const word = { pa: T('st_passes'), re: T('st_won'), sh: T('st_shots') }[kind];
      const label = `${r.man.n}  ${r.man.last.toUpperCase()}`;
      const stat = `${n} ${word}`;
      const km = `${(metresRun(r.side, r.p, clock) / 1000).toFixed(2)} ${T('st_km')}`;
      const fs = Math.max(11, Math.min(14, h * .3)) * TS(), BH = Math.round(21 * TS()), BT = Math.round(10 * TS());
      g.font = `700 ${fs}px "Archivo Variable",system-ui,sans-serif`;
      const nw = g.measureText(label).width + 16;
      g.font = `600 ${fs - 1}px "Archivo Variable",system-ui,sans-serif`;
      const sw = g.measureText(stat).width + 12, kw = g.measureText(km).width + 12;
      const tw = nw + sw + kw;
      const ty = foot[1] - h - 14 * TS();
      const vr = VW - (document.body.classList.contains('analyst') ? ($('#rail')?.offsetWidth || 0) : 0);
      const x0 = Math.max(8, Math.min(vr - tw - 8, foot[0] - tw / 2));
      // Two tags on one patch of grass is one tag too many. The subject's
      // was placed first and matters more; this one yields, and his thin
      // team ring still says who has the ball.
      if (SUBJ_TAG && x0 + tw > SUBJ_TAG.x && x0 < SUBJ_TAG.x + SUBJ_TAG.w
          && ty + BH - BT > SUBJ_TAG.y && ty - BT < SUBJ_TAG.y + SUBJ_TAG.h) continue;
      CARRIER_TAG = { x: x0 - 6, y: ty - BT - 4, w: tw + 12, h: BH + 9 };
      const kit = r.side === 'home' ? '#5aa9ff' : '#ecA322';
      const hot = fl && clock - fl.t >= 0 && clock - fl.t < .9;
      // Hard-edged, opaque, with a kit-coloured leading rule: the same
      // language as the chrome, not a rounded tooltip. Painted in the
      // overlay pass so nobody standing in front of him hides it.
      OVERLAY.push(() => {
        g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = '#1C0423'; g.fillRect(x0, ty - BT, nw, BH);
        g.fillStyle = kit; g.fillRect(x0, ty - BT, 3, BH);
        g.font = `700 ${fs}px "Archivo Variable",system-ui,sans-serif`;
        g.fillStyle = '#fff'; g.fillText(label, x0 + 1.5 + nw / 2, ty + .5);
        g.font = `600 ${fs - 1}px "Archivo Variable",system-ui,sans-serif`;
        g.fillStyle = hot ? kit : '#2A0733'; g.fillRect(x0 + nw, ty - BT, sw, BH);
        g.fillStyle = hot ? '#0B0010' : '#fff'; g.fillText(stat, x0 + nw + sw / 2, ty + .5);
        g.fillStyle = '#140219'; g.fillRect(x0 + nw + sw, ty - BT, kw, BH);
        g.fillStyle = 'rgba(255,255,255,.78)'; g.fillText(km, x0 + nw + sw + kw / 2, ty + .5);
        g.restore();
      });
    }
  }
}

/* ================== crowd ==================
   What sits under live play on a broadcast is not music, it is forty
   thousand people -- and a crowd is not filtered static, which is what
   realtime noise-through-bandpass synthesis sounds like. The bed and the
   roar are rendered OFFLINE by scripts/make_crowd.py: thousands of short
   voice-like grains (noise and buzz through vocal formants, with
   syllabic amplitude movement) overlap-added into a seamless loop and a
   one-shot. Still nobody else's audio, still no licence to clear, and
   the files are generated by a script in this repo, so they are as
   reproducible as the season itself.

   The browser's job is only the reactive part: the bed's level and
   brightness lean toward whichever box the ball is near, a shot gets the
   rising half of the roar and is cut off, a goal gets all of it --
   driven by the same event stream as everything else on screen. */
let AC = null, CROWD = null, sndOn = false, audioPtr = 0, lastAClock = -1, EXC = 0;

async function initCrowd() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const load = async url =>
    AC.decodeAudioData(await (await fetch(url)).arrayBuffer());
  const [bed, roar, swell] = await Promise.all([
    load('audio/crowd.mp3'), load('audio/roar.mp3'), load('audio/swell.mp3'),
  ]);
  const master = AC.createGain(); master.gain.value = .9;
  master.connect(AC.destination);
  const bedG = AC.createGain(); bedG.gain.value = .4;
  // The bed is a real recording now; the filter is only a gentle
  // distance cue, never an EQ fighting the material.
  const bedF = AC.createBiquadFilter();
  bedF.type = 'lowpass'; bedF.frequency.value = 4800;
  const src = AC.createBufferSource(); src.buffer = bed; src.loop = true;
  src.connect(bedF); bedF.connect(bedG); bedG.connect(master); src.start();
  CROWD = { master, bedG, bedF, roar, swell };
}

/* A goal gets the roar. An ordinary shot gets the SWELL -- a clap-free
   vocal "oooh" rendered for exactly this -- because the roar's front is
   an applause wall, and firing a burst of applause texture at every
   shot was the "disturbing crackling at intervals". */
function crowdShot(goal) {
  if (!CROWD || AC.state !== 'running') return;
  const s = AC.createBufferSource();
  s.buffer = goal ? CROWD.roar : CROWD.swell;
  s.playbackRate.value = .94 + Math.random() * .12;
  const g = AC.createGain(); g.gain.value = goal ? .95 : .5;
  s.connect(g); g.connect(CROWD.master);
  s.start(AC.currentTime);
}

function crowdFrame(dtReal) {
  if (!CROWD || AC.state !== 'running') return;
  // The crowd leans toward whichever box the ball is near.
  const want = Math.max(0, Math.min(1, (Math.abs(ballAt(clock).x - L / 2) - 12) / 38));
  EXC += (want - EXC) * Math.min(1, dtReal * 1.5);
  const t = AC.currentTime;
  const breath = .88 + .12 * Math.sin(t * .31) * Math.sin(t * .13 + 2);
  CROWD.bedG.gain.setTargetAtTime(
    ((playing ? .4 : .18) + .45 * EXC) * breath * (SAY.busy ? .35 : 1), t, .3);   // duck under the description
  CROWD.bedF.frequency.setTargetAtTime(
    (playing ? 4200 : 2800) + 4200 * EXC, t, .4);

  // React to what just happened. On a seek, drop the backlog rather than
  // roaring through half a match in one frame.
  if (clock < lastAClock - 1) audioPtr = 0;
  const st = FEED.stream;
  while (audioPtr < st.length && st[audioPtr].t <= clock) {
    const e = st[audioPtr++];
    if (clock - e.t > 2) continue;
    if (e.k === 'sh') crowdShot(!!e.g);
  }
  lastAClock = clock;
}

/* ================== loop ================== */
let GAIT = 0, DT = 1 / 60, VISB = null;

/* Film grain is a property of the camera, not the pitch, so it sits over
   the whole frame -- but painting it INTO the canvas was two thirds of
   the entire frame budget (a full-screen pattern fill at retina scale,
   every frame). It lives in a composited CSS overlay instead: the canvas
   never touches it, and a stepped transform animation keeps it moving,
   because grain that holds still reads as a dirty lens. */
function makeGrain() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d'), d = x.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 110 + ((Math.random() * 145) | 0);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = 10;
  }
  x.putImageData(d, 0, 0);
  const el = document.createElement('div');
  el.className = 'grain';
  el.style.backgroundImage = `url(${c.toDataURL()})`;
  document.querySelector('.field').appendChild(el);
}
function frame(now) {
  const dtReal = Math.min(.1, (now - last) / 1000);
  last = now;
  DT = dtReal;
  if (playing) {
    clock = Math.min(FULL, clock + dtReal * SPEED);
    if (clock >= FULL) pause();
    sync();
  }
  // Gait is driven by real seconds, not match seconds: at 12x the legs
  // would otherwise cycle twelve times too fast and read as vibration.
  GAIT = dtReal * Math.min(SPEED, 3);

  // Camera dolly: hold for small movements, then ease across. A camera
  // that tracks every touch makes the world move instead of the lens.
  // Instants. On a seek, start fresh rather than replaying the gap.
  if (CLOCK_PREV < 0 || Math.abs(clock - CLOCK_PREV) > 5) { POPS = []; GOAL = null; }
  else if (clock > CLOCK_PREV) {
    const subjTb = new Set();
    if (SUBJ && SUBJ.touches) {
      for (const e of SUBJ.touches) {
        const tb = e.tb ?? e.t;
        if (tb > CLOCK_PREV && tb <= clock) {
          subjTb.add(tb);
          // From the passer: his tag is there, and the far end of a thirty
          // metre ball is as likely as not off the top of the frame.
          // Only where the picture has him on it -- see onTheBall().
          const at0 = onTheBall(SUBJ.side, SUBJ.p, e.x, e.y, tb);
          if (at0) POPS.push({ t: tb, x: at0[0], y: at0[1],
            text: `${e.value}${SUBJ.unit}`, rgb: SUBJ.rgb, big: true });
        }
      }
    }
    if (FEED.stream) {
      for (const e of FEED.stream) {
        if (e.t > clock) break;               // tb is never earlier than t
        const tb = e.tb ?? e.t;
        if (!(tb > CLOCK_PREV && tb <= clock)) continue;
        const who = PIDX[e.p];
        if (!who) continue;
        if (e.k === 'pa' || e.k === 're' || e.k === 'sh') FLASH[`${who.side}${who.p}`] = { k: e.k, t: tb };
        if (ACC.ad !== 'off') adEvent(e, who, !!onTheBall(who.side, who.p, e.x, e.y, tb));
        if (e.k === 'sh' && e.g) {
          // The log names the scorer and the picture puts him on the ball
          // for it -- nine touches in ten. On the tenth they disagree (the
          // engine can credit a keeper with a shot from the far box), and
          // naming whoever happens to be nearest would credit a man the
          // data never did. So the goal is named only when both agree;
          // otherwise it is the club's.
          const away = who.side === 'away';
          const named = onTheBall(who.side, who.p, e.x, e.y, tb);
          GOAL = { side: who.side, p: named ? who.p : null, t: tb, logged: e.p,
                   x: EX(e.x, away), y: EY(e.y, away),
                   club: (away ? FEED.match.away : FEED.match.home).short };
          LIVE_SEC = -2;                     // the scoreboard ticks with the flash, not up to a second after it
          continue;
        }
        if (e.k !== 'pa' && e.k !== 're' && e.k !== 'sh') continue;
        const isSubj = SUBJ && who.side === SUBJ.side && who.p === SUBJ.p;
        if (isSubj && subjTb.has(tb)) continue;  // his claim's own figure already rose
        const spot = onTheBall(who.side, who.p, e.x, e.y, tb);
        if (!spot) continue;
        const text = e.k === 'pa' ? (e.d != null ? `${Math.round(e.d)}m` : null)
          : e.k === 're' ? T('pop_won') : T('pop_shot');
        if (!text) continue;
        POPS.push({ t: tb, x: spot[0], y: spot[1], text,
          rgb: isSubj ? SUBJ.rgb : (who.side === 'home' ? '90,169,255' : '255,176,32'),
          big: isSubj });
      }
    }
    { const m0 = Math.floor(CLOCK_PREV / 60), m1 = Math.floor(clock / 60);
      if (m1 > m0 && m1 % 15 === 0 && m1 < 90) adMinute(m1); }
    POPS = POPS.filter(pp => clock - pp.t < 2);
    if (GOAL && clock - GOAL.t > 4) GOAL = null;
  }
  CLOCK_PREV = clock;

  if (BALL) {
    const bl = ballAt(clock);
    const bX = bl.x;
    let aim = bX, wantSpan = RIG.span;
    // Tilt toward the play, slowly: a lens that nods at every pass makes
    // the world move instead of the ball.
    // The ball leads the tilt; the subject of the claim pulls it a
    // little, so a man on the near touchline is not cut off at the
    // bottom while the lens looks at play on the far one. Not enough to
    // lose the ball -- Prime's reviewers hated a shot widened to fit
    // everyone -- just enough to keep him in it.
    const wantY = Math.max(16, Math.min(W - 16, bl.y));
    lookY += (wantY - lookY) * (1 - Math.exp(-dtReal * 0.9));
    // ...then only as much as it takes to keep the subject in shot. This
    // cannot be solved in metres -- the same offset is worth far more
    // pixels near the lens than at the far touchline -- so it is done in
    // screen space: if his feet fall under the strap or above the stand
    // line, tilt toward him until they do not, and no further.
    if (SUBJ && !wide) {
      const Fr = FEED.frames;
      const [sx, sy] = at(SUBJ.side === 'home' ? Fr.h : Fr.a, 22, SUBJ.p * 2, clock);
      const [, py] = P(sx, sy, 0);
      const lo = VH * 0.50 + (VH - 86) / 2 - STRAP_H - 28, hi = 96;
      if (py > lo) lookY -= Math.min(2.5, (py - lo) * .02) * dtReal * 12;
      else if (py < hi) lookY += Math.min(2.5, (hi - py) * .02) * dtReal * 12;
      lookY = Math.max(16, Math.min(W - 16, lookY));
    }
    const who = followIndex();
    if (who) {
      const F = FEED.frames;
      const [fx] = at(who.side === 'home' ? F.h : F.a, 22, who.p * 2, clock);
      // Frame both: aim between them, and open up enough to hold the
      // pair with room to spare, never past the wide shot.
      aim = (bX + fx) / 2;
      wantSpan = Math.max(RIG.span, Math.min(96, Math.abs(fx - bX) + 34));
    }
    // Ease the zoom, or it snaps every time he moves.
    if (!spanNow) spanNow = wantSpan;
    spanNow += (wantSpan - spanNow) * (1 - Math.exp(-dtReal * 1.2));
    if (!wide) buildCam();
    const edge = Math.max(11, spanNow * .22);
    const target = Math.max(edge, Math.min(L - edge, aim));
    const err = target - camX, dz = 7;
    const want = Math.abs(err) <= dz ? camX : target - Math.sign(err) * dz;
    camX += (want - camX) * (1 - Math.exp(-dtReal * Math.min(SPEED, 6) / 1.4));

    // Keeping him framed cannot be solved in metres: the same offset is
    // worth far more pixels near the camera than at the far touchline,
    // so a player close to the lens slides off the edge while the maths
    // says he is only a few metres from the ball. Correct on what is
    // actually on screen -- widen until he sits inside the comfortable
    // band, and let it fall back when he does.
    if (who && !wide) {
      const F2 = FEED.frames;
      const [px, py] = at(who.side === 'home' ? F2.h : F2.a, 22, who.p * 2, clock);
      const over = Math.abs(P(px, py, 0)[0] - CAM.cx) / (VW * .40);
      if (over > 1) {
        spanNow = Math.min(96, spanNow * (1 + Math.min(.6, over - 1) * dtReal * 3));
        buildCam();
      }
    }
  }

  crowdFrame(dtReal);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SUBJ = subjectIndex();
  drawPitch(); drawEvents(); drawFollow(); drawPeople(); drawOverlay();
  if (CAP_T && performance.now() - CAP_T > 4500) { $('#cap').classList.remove('on'); CAP_T = 0; }
  requestAnimationFrame(frame);
}

/* ================== moments ================== */
function minuteNow() { return Math.floor(clock / 60); }

function showMoment(i) {
  const m = FEED.moments[i];
  if (!m) return;
  idx = i;
  const lo = $('#lower');
  lo.classList.remove('ask');
  $('#lFormK').textContent = T('form_line');
  lo.classList.toggle('dn', !m.above);
  $('#lName').textContent = m.player;
  $('#lMeta').textContent = `${m.club} · ${m.minute}' · ${TX(m, 'metric')}`;
  // Who wrote this sentence, on the sentence. The EU AI Act asks that
  // AI-generated text be disclosed as such; the honest label is also the
  // one that says when no AI was involved at all.
  $('#lWriter').textContent = writerLabel(m);
  // Two deliberate lines rather than one that wraps: "league-/wide"
  // breaking across a line looks like a bug, because it is one.
  const tag = m.diverges
    ? [m.above ? T('above') : T('below'), T('ordinary')]
    : (m.above ? [T('above'), ''] : [T('below'), '']);
  $('#lTag').innerHTML = tag.map(t => `<span>${t}</span>`).join('');
  $('#lSaid').textContent = TX(m, 'text');

  // The Form Line is the hero block, read first. Everything else on the
  // strap is a supporting figure any competitor could also show.
  const hero = $('#lForm');
  if (m.season_mean != null) {
    hero.textContent = `${m.z > 0 ? '+' : ''}${m.z} SD`;
    hero.style.fontSize = '';
  } else {
    hero.textContent = 'refused';
    hero.style.fontSize = '22px';
    $('#lTag').textContent = 'no between-player signal · league claim only';
  }
  $('#lNums').innerHTML = `
    <div class="ln"><div class="k micro">${T('tonight')}</div><div class="v fig">${m.value}</div>
      <div class="s meta">${TX(m, 'metric')}</div></div>
    <div class="ln league"><div class="k micro">${T('league')}</div>
      <div class="v fig">${Math.round(m.league_pct)}%</div>
      <div class="s meta">${T('beaten')} ${m.expected}</div></div>
    <div class="ln"><div class="k micro">${T('his_norm')}</div>
      <div class="v fig">${m.season_mean ?? '—'}</div>
      <div class="s meta">${m.season_mean != null ? m.appearances + ' ' + T('matches') : '—'}</div></div>`;
  lo.classList.add('up');

  /* Ordered by what is actually in dispute.

     Nobody doubts that 13.77 is 13.77 -- in sport the figures are
     expected to be right, and a receipt proving one equals itself
     impresses nobody. What is in dispute is the sentence built on it:
     whether "below his level" is a claim anyone is entitled to make
     about this player, on this metric. So the reference class and the
     gate's verdict lead, and the measurement is the footnote it is. */
  const chain = [];
  if (m.season_mean != null) {
    chain.push(['His own season', `norm <code>${m.season_mean}</code> over <code>${m.appearances}</code> matches · <code>${m.z > 0 ? '+' : ''}${m.z} SD</code>`]);
    chain.push(['Verdict', m.diverges
      ? (m.above ? 'Ordinary against the league, clearly above his own level.'
                 : 'Ordinary against the league, well below his own level — only his history shows it.')
      : (m.above ? "Above his level and the league's." : 'Below his own level.')]);
  } else {
    chain.push(['Refused', 'No personal claim: this metric has no between-player signal.']);
  }
  if (m.icc != null) {
    chain.push(['Entitled to say it', m.personal
      ? `ICC <code>${m.icc}</code> ≥ 0.08 — his own history means something for this metric`
      : `ICC <code>${m.icc}</code> &lt; 0.08 — league claims only; his norm would be the league's wearing his name`]);
  }
  chain.push(['The league sees', `norm <code>${m.expected}</code>, beaten <code>${Math.round(m.league_pct)}%</code> — the view a broadcast already has`]);
  chain.push(['Measured', `<code>${TX(m, 'metric')} = ${m.value}</code> as of ${m.minute}' · recomputed from the events`]);
  chain.push(['Gate', m.grounded
    ? `every number verified · <code>${m.model}</code>` : 'fell back to template']);
  $('#sheet').innerHTML = `<h3>Why</h3>` +
    chain.map(([k, v]) => `<div class="step"><b>${k}</b><span>${v}</span></div>`).join('');

  const asking = needsCall(i);
  if (asking) {
    renderAsk(i);
    if (showWhy) { showWhy = false; $('#sheet').classList.remove('up'); $('#lower').classList.remove('hide'); }
  } else if (JUST === i && i in CALL.ans) {
    const hit = (m.z > 0 ? 'up' : 'down') === CALL.ans[i];
    $('#lFormK').textContent = `${hit ? '✓' : '✗'} ${T(hit ? 'call_hit' : 'call_miss')}`;
  }
  // Spoken once per moment, when it arrives -- not on a language switch
  // or a re-render, and not at load, where nobody has asked for sound.
  if (BOOTED && i !== ANNOUNCED) {
    ANNOUNCED = i;
    say(asking ? callQuestion(m) : TX(m, 'text'), 3);
  }

  if ($('#tryit').classList.contains('up')) openTry(true);
  document.querySelectorAll('.row').forEach((r, j) => {
    r.setAttribute('aria-current', j === i);
    // Scroll the rail itself, never the page: scrollIntoView on a row of a
    // rail that is off-canvas (Fan mode, phones) dragged the whole pitch
    // sideways to reveal it.
    if (j === i && mode === 'analyst') {
      const box = r.parentElement, rr = r.getBoundingClientRect(), bb = box.getBoundingClientRect();
      if (rr.top < bb.top || rr.bottom > bb.bottom)
        box.scrollTo({ top: Math.max(0, box.scrollTop + rr.top - bb.top - 8), behavior: 'smooth' });
    }
  });
}

/* Binding the console to one player. Every other entry in this field has
   a "follow a player" dropdown that filters a feed; following here means
   watching someone measured against HIMSELF -- his own season is the
   reference class, his touches are lit on the grass, and the strap stops
   reporting the match and starts reporting him. */
function setFollow(i) {
  const fl = followNow();
  FOLLOW = (i == null) ? null : { i, ...fl[i] };
  document.querySelectorAll('#follow button').forEach((b, j) =>
    b.setAttribute('aria-pressed', FOLLOW != null && j === i));
  $('#lower').classList.toggle('follow', !!FOLLOW);
  if (!FOLLOW) spanNow = RIG.span;
  if (FOLLOW && FOLLOW.metric) showFollow();
  else { idx = -1; sync(); }
}

function showFollow() {
  const f = FOLLOW, lo = $('#lower');
  $('#lName').textContent = f.player;
  $('#lMeta').textContent = `${f.club} · ${f.position} · #${f.shirt} · ${TX(f, 'metric')}`;
  // NOTABLE_Z in form.py is 1.5: below it the claim sentence says "in
  // line with his season norm", so the tag must not shout "above his
  // level" beside it. The two are generated in different places and
  // disagreeing on screen is worse than saying less.
  const notable = Math.abs(f.z) >= 1.5;
  $('#lTag').innerHTML = (
    !notable ? ['in line with', 'his own norm']
    : f.diverges ? [f.above ? 'above his level' : 'below his level',
                    'ordinary league-wide']
    : [f.above ? 'above his level' : 'below his level', 'tonight']
  ).map(t => `<span>${t}</span>`).join('');
  lo.classList.toggle('dn', notable && !f.above);
  $('#lSaid').textContent = TX(f, 'claim');
  const hero = $('#lForm');
  hero.textContent = `${f.z > 0 ? '+' : ''}${f.z} SD`;
  hero.style.fontSize = '';
  $('#lNums').innerHTML = `
    <div class="ln"><div class="k micro">${T('tonight')}</div><div class="v fig">${f.value}</div>
      <div class="s meta">${TX(f, 'metric')}</div></div>
    <div class="ln league"><div class="k micro">League</div>
      <div class="v fig">${Math.round(f.league_pct)}%</div>
      <div class="s meta">${T('beaten')} ${f.league_mean}</div></div>
    <div class="ln"><div class="k micro">${T('his_norm')}</div>
      <div class="v fig">${f.season_mean}</div>
      <div class="s meta">${f.appearances} ${T('matches')}</div></div>`;
  lo.classList.add('up');
  $('#sheet').classList.remove('up');
}

/* Open on the claim, and on the most watchable twenty seconds of its
   minute. The claim is "as of 30'", so anywhere in the 30th minute is
   honest; but the first second of it is usually midfield circulation,
   and the viewer is about to be asked to watch the pitch for a while.
   So pick the start, inside the minute, whose next twenty seconds carry
   the ball nearest a goal line -- the stretch with a box entry in it,
   when the minute has one. Data-driven, so it holds for any seed. */
function bestOpening(minute) {
  const base = minute * 60, LOOK = 20;
  let best = base + 1, bestNear = 1e9;
  for (let t = base + 1; t <= base + 59 - LOOK; t += 1) {
    let near = 1e9;
    for (const s of BALL) {
      if (s.t1 < t || s.t0 > t + LOOK) continue;
      near = Math.min(near, s.ax, s.bx, L - s.ax, L - s.bx);
    }
    if (near < bestNear - 0.5) { bestNear = near; best = t; }
  }
  return best;
}

/* Everything live on the scoreboard comes from one pure function over
   the event stream, so the page cannot drift from the Python that
   computed the 90' state block: a test runs this same function in Node
   over the shipped stream and holds it to that block. Possession is time
   between events, credited to the team of the last touch. */
function tallyStream(stream, homeId, t) {
  const mk = () => ({ passes: 0, shots: 0, goals: 0, recoveries: 0, poss: 0 });
  const H = mk(), A = mk();
  let last = null, tPrev = 0;
  for (const e of stream) {
    if (e.t > t) break;
    const s = e.m === homeId ? H : A;
    if (last) last.poss += e.t - tPrev;
    last = s; tPrev = e.t;
    if (e.k === 'pa') s.passes++;
    else if (e.k === 'sh') { s.shots++; if (e.g) s.goals++; }
    else if (e.k === 're') s.recoveries++;
  }
  if (last) last.poss += Math.max(0, t - tPrev);
  const tot = H.poss + A.poss || 1;
  H.possPct = Math.round(100 * H.poss / tot); A.possPct = 100 - H.possPct;
  return { home: H, away: A };
}

let LIVE_SEC = -1, LAST_GOALS = [0, 0];
function liveTick() {
  const sec = Math.floor(clock);
  if (sec === LIVE_SEC || !FEED.stream) return;
  if (sec < LIVE_SEC) LAST_GOALS = [-1, -1];   // seek back: force both to repaint
  LIVE_SEC = sec;
  const L2 = tallyStream(FEED.stream, FEED.match.home.id, clock);
  for (const [side, el, i] of [[L2.home, $('#hG'), 0], [L2.away, $('#aG'), 1]]) {
    if (side.goals !== LAST_GOALS[i]) {
      el.textContent = side.goals;
      if (side.goals > LAST_GOALS[i]) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
      LAST_GOALS[i] = side.goals;
    }
  }
  const cell = (k, h, a) => `<div><b>${T(k)}</b><span class="v"><span class="h">${h}</span><span class="sep">·</span><span class="a">${a}</span></span></div>`;
  $('#tick').innerHTML =
    cell('live_poss', L2.home.possPct + '%', L2.away.possPct + '%') +
    cell('live_passes', L2.home.passes, L2.away.passes) +
    cell('live_shots', L2.home.shots, L2.away.shots) +
    cell('live_recov', L2.home.recoveries, L2.away.recoveries);
}

function sync() {
  const mn = minuteNow();
  $('#clk').textContent = mn + "'";
  liveTick();
  const cp = followCheckpoint();
  if (cp !== FOLLOW_CP) {
    FOLLOW_CP = cp;
    if (FOLLOW) {
      // The man, not his row: he may have moved, or dropped out of the
      // six. Keep his entry as it was at the checkpoint he is still in.
      const j = followNow().findIndex(f => f.player_id === FOLLOW.player_id);
      if (j >= 0) FOLLOW = { i: j, ...followNow()[j] };
    }
    if (typeof renderRail === 'function') renderRail();
  }
  $('#fill').style.width = (clock / FULL * 100) + '%';
  document.querySelectorAll('.row').forEach((r, i) =>
    r.classList.toggle('fired', FEED.moments[i].minute <= mn));
  document.querySelectorAll('.pip').forEach((p, i) =>
    p.classList.toggle('hit', FEED.moments[i].minute <= mn));

  // A followed player owns the strap: the match's own moments stop
  // interrupting him, which is the point of following someone.
  if (FOLLOW && FOLLOW.metric) { showFollow(); return; }
  const due = FEED.moments.map((m, i) => [m.minute, i]).filter(([k]) => k <= mn);
  if (!due.length) { $('#lower').classList.remove('up'); $('#sheet').classList.remove('up'); idx = -1; return; }
  // Two moments can share a minute. The opener picks the stronger one;
  // pressing Play must not swap it for its sibling under the viewer, who
  // has just been read its numbers. Hold whatever is on screen while its
  // minute is still the latest due, and only on a new minute pick the
  // most divergent of the moments that minute brings.
  const latest = Math.max(...due.map(([k]) => k));
  const cur = FEED.moments[idx];
  if (idx >= 0 && cur && cur.minute === latest) return;
  const want = due.filter(([k]) => k === latest).map(([, i]) => i)
    .reduce((a, b) => Math.abs(FEED.moments[b].z ?? 0) > Math.abs(FEED.moments[a].z ?? 0) ? b : a);
  if (want !== idx) showMoment(want);
}

function play() {
  if (clock >= FULL) { clock = 0; idx = -1; }
  playing = true; last = performance.now();
  $('#play').textContent = '❚❚ ' + T('pause'); $('#live').classList.add('on');
}
function pause() {
  playing = false; $('#play').textContent = '▶ ' + T('play'); $('#live').classList.remove('on');
}

// The three rail lists carry metric names and verdicts, so they are
// rebuilt on a language change rather than translated in place. Handlers
// are rebound here because replacing innerHTML discards them -- a silent
// way to ship a rail that looks right and does nothing.
function renderRail() {
  const d = FEED;
  $('#timeline').innerHTML = d.moments.map((m, i) => `
    <button class="row"><div class="t"><span class="mn">${m.minute}'</span>
      <span class="nm">${m.player}</span>
      ${m.diverges ? `<span class="dt" style="background:${m.above ? 'var(--up)' : 'var(--down)'}"></span>` : ''}
    </div><div class="mt">${TX(m, 'metric')} · <span class="num">${m.value} vs ${m.season_mean ?? m.expected}</span></div></button>`).join('');
  // A moment the fan has not called yet must not be answered by the rail:
  // no verdict dot, no norm -- just the man and the metric.
  d.moments.forEach((m, i) => {
    if (!needsCall(i)) return;
    const r = $('#timeline').children[i];
    r.querySelector('.dt')?.remove();
    r.querySelector('.mt').textContent = `${TX(m, 'metric')} · ?`;
  });
  { const mn = minuteNow();
    [...$('#timeline').children].forEach((r, i) => {
      r.classList.toggle('fired', d.moments[i].minute <= mn);
      r.setAttribute('aria-current', i === idx);
    }); }
  document.querySelectorAll('.row').forEach((r, i) => r.onclick = () => {
    pause(); clock = d.moments[i].minute * 60 + 1; sync(); showMoment(i);
  });
  const fl = followNow();
  $('#hFollow').textContent = T('follow') + (followCheckpoint() != null ? ` · ${followCheckpoint()}'` : '');
  $('#follow').innerHTML = fl.map((f, i) =>
    `<button class="item" aria-pressed="false"><span class="r">${i + 1}</span>
     <span>${f.player}</span>
     <span class="v">${f.score.toFixed(3)}</span></button>`).join('');
  document.querySelectorAll('#follow button').forEach((btn, i) => {
    btn.setAttribute('aria-pressed', !!(FOLLOW && fl[i] && fl[i].player_id === FOLLOW.player_id));
    btn.onclick = () => setFollow(FOLLOW && fl[i].player_id === FOLLOW.player_id ? null : i);
  });
  $('#signal').innerHTML = d.signal.map(s =>
    `<div class="item"><span>${TX(s, 'metric')}</span>
     <span class="icc">${s.icc.toFixed(3)}</span>
     <span class="v ${s.personal ? 'yes' : 'no'}">${s.personal ? T('personal') : T('league_only')}</span></div>`).join('');
  if (idx >= 0) {
    const cur = document.querySelectorAll('.row')[idx];
    if (cur) cur.setAttribute('aria-current', 'true');
  }
  document.querySelectorAll('.row').forEach((r, i) => {
    if (FEED.moments[i].minute * 60 <= clock) r.classList.add('fired');
  });
}

// Switching language re-renders; it never refetches. Every claim in
// every language is already in the feed and already gated, so the numbers
// cannot move when the words do -- which is the point worth watching.
function setLang(code) {
  LANG = code;
  const rtl = (FEED.i18n?.dir?.[code] ?? 'ltr') === 'rtl';
  document.documentElement.lang = code;
  // Only the prose flips. Mirroring the pitch would put the left back
  // on the right wing, which is a different match.
  for (const el of [$('#rail'), $('#lower'), $('#sheet')]) {
    el.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  }
  $('#lFormK').textContent = T('form_line');
  $('#hMoments').textContent = T('moments');
  $('#hFollow').textContent = T('follow');
  $('#hSignal').textContent = T('signal');
  $('#why').textContent = T('why');
  $('#try').textContent = T('try_btn');
  $('#wide').textContent = T('wide');
  $('#snd').textContent = T('sound');
  $('#accBtn').textContent = T('acc_btn');
  $('#cv').setAttribute('aria-label', T('pitch_label'));
  if ($('#acc').classList.contains('up')) renderAcc();
  paintCallChip();
  $('#mAnalyst').textContent = T('analyst');
  $('#mFan').textContent = T('fan');
  $('#play').textContent = playing ? '❚❚ ' + T('pause') : '▶ ' + T('play');
  $('#live').innerHTML = `<i></i>${T('live')}`;
  LIVE_SEC = -1; liveTick();
  renderRail();
  if (FOLLOW && FOLLOW.metric) showFollow();
  else if (idx >= 0) showMoment(idx);
}

/* ================== accessibility ==================
   Settings a fan sets once and keeps: spoken description of the match,
   the voice it uses, captions, larger text, less motion, and the Call it
   game. Kept in this browser only; nothing here needs an account. */
const ACC_DEF = { ad: 'off', voice: 'browser', rate: 1, captions: true,
                  large: false, motion: false, callit: true };
let ACC = { ...ACC_DEF }, AZURE = false;
try { Object.assign(ACC, JSON.parse(localStorage.getItem('gp.acc') || '{}')); } catch (e) {}
function saveAcc() { try { localStorage.setItem('gp.acc', JSON.stringify(ACC)); } catch (e) {} }
const TS = () => ACC.large ? 1.3 : 1;          // canvas text scale

function applyAcc() {
  document.body.classList.toggle('large', !!ACC.large);
  document.body.classList.toggle('still', !!ACC.motion);
  $('#callChip').classList.toggle('hide', !ACC.callit);
  if (ACC.ad === 'off') { stopSpeech(); SAY.q = []; $('#cap').classList.remove('on'); }
  $('#srLive').setAttribute('aria-live', ACC.voice === 'reader' && ACC.ad !== 'off' ? 'polite' : 'off');
  paintCallChip();
}

function renderAcc() {
  const row = (key, label, opts) => `<div class="accrow"><span class="accl">${T(label)}</span>
    <span class="seg" role="group" aria-label="${T(label)}">${opts.map(([v, l, dis]) =>
      `<button class="btn" data-k="${key}" data-v="${v}" aria-pressed="${String(ACC[key]) === String(v)}"
        ${dis ? 'aria-disabled="true" title="' + T('acc_noazure') + '"' : ''}>${l}</button>`).join('')}</span></div>`;
  const onoff = k => [['false', T('acc_off')], ['true', T('acc_on')]];
  $('#accTitle').textContent = T('acc_title');
  $('#accGrid').innerHTML =
    row('ad', 'acc_ad', [['off', T('acc_off')], ['key', T('acc_key')], ['full', T('acc_full')]]) +
    row('voice', 'acc_voice', [['azure', T('acc_azure'), !AZURE], ['browser', T('acc_browser')], ['reader', T('acc_reader')]]) +
    row('rate', 'acc_rate', [['0.8', '0.8×'], ['1', '1×'], ['1.25', '1.25×']]) +
    row('captions', 'acc_captions', onoff()) +
    row('large', 'acc_large', onoff()) +
    row('motion', 'acc_motion', onoff()) +
    row('callit', 'acc_callit', onoff()) +
    (ACC.voice === 'azure' && !AZURE ? `<p class="hint">${T('acc_noazure')}</p>` : '') +
    `<p class="hint priv">${T('priv')}${ACC.voice === 'azure' && AZURE ? ' ' + T('priv_azure') : ''}</p>` +
    // Say which voice will actually speak: "Microsoft Ryan Online
    // (Natural)" in Edge, something plainer elsewhere.
    ((ACC.voice === 'browser' || (ACC.voice === 'azure' && !AZURE)) && voiceLabel()
      ? `<p class="hint">♪ ${escapeHtml(voiceLabel())}</p>` : '');
  $('#accGrid').querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k, raw = b.dataset.v;
    const v = raw === 'true' ? true : raw === 'false' ? false : (k === 'rate' ? parseFloat(raw) : raw);
    const was = ACC.ad;
    ACC[k] = v; saveAcc(); applyAcc(); renderAcc();
    if (k === 'callit') { renderRail(); if (idx >= 0) showMoment(idx); }
    // Turning description on says so, in the chosen voice -- the only
    // way a blind user knows the switch did anything.
    if (k === 'ad' && v !== 'off' && was === 'off') say(`${T('acc_ad')}: ${b.textContent}.`, 3);
    if (k === 'voice' && ACC.ad !== 'off') say(`${T('acc_voice')}: ${b.textContent}.`, 3);
  });
}

function openAcc(on) {
  if (on) { openTry(false); showWhy = false; $('#sheet').classList.remove('up'); renderAcc(); }
  $('#acc').classList.toggle('up', !!on);
  $('#accBtn').setAttribute('aria-pressed', !!on);
  if (on) setTimeout(() => { const b = $('#accGrid button'); if (b) b.focus({ preventScroll: true }); scrollTo(0, 0); }, 420);
}

/* ================== audio description ==================
   Radio-style: the name of the man on the ball, the long pass and its
   length, the ball won back, the shot, the goal and the score, the minute
   every fifteen -- and the Form Line claim, read as the Gate passed it.

   describe() is pure, so a test can run it in Node over the whole match
   and check that every number it would ever say comes from the event row,
   the score or the clock. Claims are never composed here; they are the
   gated text, verbatim. */
function fill(tpl, v) { return String(tpl).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? ''); }
function describe(e, c, ui) {
  // c: { name, club, verbosity, last, named, home, away, hg, ag }
  const full = c.verbosity === 'full';
  if (e.k === 'sh' && e.g)
    return { text: fill(ui.ad_goal, { who: c.named ? c.name : c.club, home: c.home, away: c.away, hg: c.hg, ag: c.ag }),
             prio: 3, excited: true };
  if (e.k === 'sh') return { text: `${fill(ui.ad_shot, { name: c.name })}. ${ui.ad_nogoal}`, prio: 2 };
  if (!full) return null;
  if (e.k === 're') return { text: fill(ui.ad_won, { name: c.name }), prio: 1 };
  if (e.k === 'pa' && e.d != null && e.d >= 25)
    return { text: fill(ui.ad_long, { name: c.name, d: Math.round(e.d) }), prio: 1 };
  if ((e.k === 'pa' || e.k === 'ca') && c.last !== e.p) return { text: c.name, prio: 0 };
  return null;
}
function describeMinute(min, c, ui) {
  return { text: fill(ui.ad_min, { min, home: c.home, away: c.away, hg: c.hg, ag: c.ag }), prio: 2 };
}

const SAY = { q: [], busy: false, audio: null, last: null };
const VOICE_LANG = { en: 'en-GB', 'en-simple': 'en-GB', es: 'es-ES', fr: 'fr-FR', ar: 'ar-SA' };
function uiNow() { return { ...(FEED.i18n?.ui?.en || {}), ...(FEED.i18n?.ui?.[LANG] || {}) }; }

let CAP_T = 0;
function caption(text) {
  if (!ACC.captions) return;
  const c = $('#cap'); c.textContent = text; c.classList.add('on');
  c.setAttribute('dir', (FEED.i18n?.dir?.[LANG] ?? 'ltr'));
  CAP_T = performance.now();
}
function say(text, prio = 1, opts = {}) {
  if (ACC.ad === 'off' || !text) return;
  if (ACC.voice === 'reader') {
    caption(text);
    // The fan's own screen reader speaks it, at the speed and in the voice
    // they already chose. Re-set the text so a repeat is still announced.
    const sr = $('#srLive'); sr.textContent = ''; setTimeout(() => sr.textContent = text, 30);
    return;
  }
  const item = { text, prio, at: performance.now(), excited: !!opts.excited };
  if (prio >= 3) { stopSpeech(); SAY.q = SAY.q.filter(x => x.prio >= 3); }
  SAY.q.push(item);
  SAY.q.sort((a, b) => b.prio - a.prio || a.at - b.at);
  pump();
}
function stopSpeech() {
  try { if (SAY.audio) { SAY.audio.pause(); SAY.audio = null; } } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  SAY.busy = false;
}
function pump() {
  if (SAY.busy) return;
  const now = performance.now();
  // A name is only worth saying while he still has the ball.
  SAY.q = SAY.q.filter(x => x.prio >= 2 || now - x.at < 2200);
  const it = SAY.q.shift();
  if (!it) return;
  SAY.busy = true;
  caption(it.text);                    // the words on screen are the words being spoken, in that order
  const done = () => { if (SAY.busy) { SAY.busy = false; pump(); } };
  speakNow(it).then(done, done);
}
async function speakNow(it) {
  if (ACC.voice === 'azure' && AZURE) {
    try {
      const r = await fetch('api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: it.text, lang: LANG, rate: ACC.rate, excited: it.excited }) });
      if (!r.ok) throw new Error(r.status);
      const url = URL.createObjectURL(await r.blob());
      const a = new Audio(url); SAY.audio = a;
      await new Promise(res => { a.onended = a.onerror = res; a.play().catch(res); });
      URL.revokeObjectURL(url);
      return;
    } catch (e) { /* this line falls back to the browser voice */ }
  }
  if (!('speechSynthesis' in window)) return;
  await new Promise(res => {
    const u = new SpeechSynthesisUtterance(it.text);
    u.lang = VOICE_LANG[LANG] || 'en-GB';
    const v = pickVoice(u.lang);
    if (v) u.voice = v;
    u.rate = ACC.rate * (LANG === 'en-simple' ? .9 : 1) * (it.excited ? 1.08 : 1);
    u.pitch = it.excited ? 1.15 : 1;
    u.onend = u.onerror = res;
    setTimeout(res, 12000);             // a voice that never fires onend must not wedge the queue
    speechSynthesis.speak(u);
  });
}

/* Microsoft Edge exposes Microsoft's own neural voices to every web page
   as "Microsoft Ryan Online (Natural)" and friends -- the same voice
   family Azure AI Speech sells, with no account and no key. So the browser
   voice prefers a Natural one, then any online voice, then whatever the
   machine has. Entries with a missing name or language (an Edge 150
   regression) are skipped rather than chosen. */
function pickVoice(lang) {
  let vs = [];
  try { vs = speechSynthesis.getVoices(); } catch (e) { return null; }
  vs = vs.filter(v => v.name && v.lang && !/undefined/.test(v.name));
  const exact = vs.filter(v => v.lang === lang), near = vs.filter(v => v.lang.startsWith(lang.slice(0, 2)));
  const rank = v => (/Natural/.test(v.name) ? 0 : /Online|Neural/.test(v.name) ? 1 : /Google/.test(v.name) ? 2 : 3);
  for (const pool of [exact, near]) if (pool.length) return [...pool].sort((a, b) => rank(a) - rank(b))[0];
  return null;
}
function voiceLabel() {
  const v = pickVoice(VOICE_LANG[LANG] || 'en-GB');
  return v ? v.name : '';
}
try { speechSynthesis.onvoiceschanged = () => { if ($('#acc')?.classList.contains('up')) renderAcc(); }; } catch (e) {}

function adEvent(e, who, named) {
  if (ACC.ad === 'off') return;
  const man = FEED.lineups[who.side][who.p];
  const T2 = tallyStream(FEED.stream, FEED.match.home.id, e.tb ?? e.t);
  const away = who.side === 'away';
  const line = describe(e, {
    name: man.last, club: (away ? FEED.match.away : FEED.match.home).name,
    verbosity: ACC.ad, last: SAY.last, named,
    home: FEED.match.home.name, away: FEED.match.away.name, hg: T2.home.goals, ag: T2.away.goals,
  }, uiNow());
  if (e.k === 'pa' || e.k === 'ca' || e.k === 're') SAY.last = e.p;
  if (line) say(line.text, line.prio, { excited: line.excited });
}
function adMinute(min) {
  if (ACC.ad === 'off') return;
  const T2 = tallyStream(FEED.stream, FEED.match.home.id, clock);
  const l = describeMinute(min, { home: FEED.match.home.name, away: FEED.match.away.name,
    hg: T2.home.goals, ag: T2.away.goals }, uiNow());
  say(l.text, l.prio);
}

/* ================== Call it ==================
   Before a Form Line is revealed, the fan calls it: above or below his own
   level? They are shown what a broadcast would show -- the number tonight,
   and when the league reads it as ordinary, that too -- and asked the one
   question only his own season can answer. Then the answer, the Gate's
   sentence, and a streak. The opening claim is the worked example and is
   never asked. */
let CALL = { ans: {}, hits: 0, total: 0, streak: 0 }, OPENER = -1, BOOTED = false, ANNOUNCED = -1, JUST = -1;
const callKey = () => `gp.call.${FEED.match.home.id}-${FEED.match.away.id}`;
function loadCall() { try { Object.assign(CALL, JSON.parse(sessionStorage.getItem(callKey()) || '{}')); } catch (e) {} }
function saveCall() { try { sessionStorage.setItem(callKey(), JSON.stringify(CALL)); } catch (e) {} }   // one sitting: a fresh visit gets fresh questions
function writerLabel(m) {
  if (!m || !m.model) return '';
  if (m.fell_back) return T('wr_fallback');
  const rv = m.review || {};
  if (rv.status === 'approved') return fill(uiNow().wr_approved, { model: m.model, by: rv.by });
  if (rv.status === 'pending') return T('wr_pending');
  if (rv.status === 'rejected') return fill(uiNow().wr_rejected, { by: rv.by });
  if (m.model === 'template') return T('wr_template');
  return fill(uiNow().wr_model, { model: m.model });
}
function needsCall(i) {
  const m = FEED.moments[i];
  return ACC.callit && m && m.season_mean != null && i !== OPENER && !(i in CALL.ans);
}
function callQuestion(m) {
  const ui = uiNow();
  const q = fill(ui.call_q, { name: m.player, metric: TX(m, 'metric'), value: m.value });
  return m.diverges ? `${q} ${ui.call_league}` : q;
}
function renderAsk(i) {
  const m = FEED.moments[i], lo = $('#lower');
  lo.classList.add('ask'); lo.classList.remove('dn');
  $('#lFormK').textContent = T('call_title');
  $('#lForm').textContent = '?';
  $('#lTag').innerHTML = `<span>${T('call_wait')}</span>`;
  $('#lSaid').textContent = callQuestion(m);
  $('#lNums').innerHTML = `
    <button class="callb up" id="cUp">▲ ${T('call_up')}</button>
    <button class="callb dn" id="cDn">▼ ${T('call_down')}</button>`;
  $('#cUp').onclick = () => answerCall(i, 'up');
  $('#cDn').onclick = () => answerCall(i, 'down');
}
function answerCall(i, pick) {
  const m = FEED.moments[i];
  if (!m || i in CALL.ans) return;
  const hit = (m.z > 0 ? 'up' : 'down') === pick;
  CALL.ans[i] = pick; CALL.total++;
  if (hit) { CALL.hits++; CALL.streak++; } else CALL.streak = 0;
  saveCall(); JUST = i;
  renderRail();
  showMoment(i);
  paintCallChip(true);
  say(`${T(hit ? 'call_hit' : 'call_miss')}. ${TX(m, 'text')}`, 3);
}
function paintCallChip(flash) {
  const c = $('#callChip');
  if (!c || !FEED) return;
  c.innerHTML = `<b>${T('call_title')}</b> ${CALL.hits}/${CALL.total}` +
    (CALL.streak > 1 ? ` · ${CALL.streak} ${T('call_streak')}` : '');
  if (flash) { c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit'); }
}

/* The Gate, in the browser.

   Deliberately not a reimplementation: the numbers a claim is allowed to
   contain ship with the moment, straight from the same Brief the Python
   Gate checks against, and the tolerance comes from the feed too. All
   this does is find digits and compare -- which is all the Gate does,
   and why one rule can cover a server, an MCP tool and a text box. */
const escapeHtml = s => s.replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function gateMarks(text, allowed, tol) {
  return (text.match(/-?\d+(?:\.\d+)?/g) || []).map(tok => ({
    tok, ok: allowed.some(a => Math.abs(parseFloat(tok) - a) <= tol),
  }));
}

function runTry() {
  const m = FEED.moments[idx];
  const out = $('#tryOut');
  if (!m || !m.allowed) { out.textContent = ''; return; }
  const raw = $('#tryIn').value;
  const tol = (FEED.gate && FEED.gate.tolerance) || 0.051;
  const marks = gateMarks(raw, m.allowed, tol);
  let k = 0;
  const shown = escapeHtml(raw).replace(/-?\d+(?:\.\d+)?/g, tok => {
    const mk = marks[k++];
    return `<span class="${mk && mk.ok ? 'ok' : 'bad'}">${tok}</span>`;
  });
  const bad = marks.filter(x => !x.ok).map(x => x.tok);
  // Saying "every number checks out" about a sentence with no numbers in
  // it would be the one dishonest thing on this page. It is also the
  // documented hole, so the panel names it rather than hiding it.
  if (!marks.length) {
    out.innerHTML = `<div>${shown}</div>` +
      `<div class="verdict">${T('try_nonumbers')}</div>`;
    return;
  }
  out.innerHTML = `<div>${shown}</div>` + (bad.length
    ? `<div class="verdict no">${T('try_rejected')} · ${bad.join(', ')} — ${T('try_unsupported')}</div>
       <div class="instead">${T('try_instead')}: <b>${TX(m, 'text')}</b></div>`
    : `<div class="verdict yes">${T('try_allowed')}</div>`);
}

function openTry(on) {
  const m = FEED.moments[idx];
  // Why and Try it share the bottom-left corner. Opening both stacked
  // them, so the second buried the first and closing it uncovered a
  // panel the viewer had forgotten opening.
  if (on) { showWhy = false; $('#sheet').classList.remove('up'); }
  $('#tryit').classList.toggle('up', on && !!m);
  $('#try').setAttribute('aria-pressed', !!on);
  if (!on || !m) return;
  $('#tryTitle').textContent = T('try_title');
  $('#tryIn').setAttribute('aria-label', T('try_title'));
  $('#tryHint').textContent = T('try_hint');
  $('#tryGo').textContent = T('try_check');
  // Pre-loaded with the lie from the MCP demo, so the two
  // demonstrations tell one story and a judge need only press a key.
  $('#tryIn').value =
    `${m.player}'s ${TX(m, 'metric')} is 21.4 tonight, the best of his season.`;
  $('#tryOut').innerHTML = '';
  // The sheet starts below the fold at translateY(101%). Focusing an
  // input inside it immediately makes the browser scroll the page down
  // to reach it, which drags the pitch off screen and uncovers panels
  // that are supposed to be hidden. Wait for the transition, and ask the
  // browser not to scroll even then.
  setTimeout(() => {
    try { $('#tryIn').focus({ preventScroll: true }); } catch (e) { $('#tryIn').focus(); }
    $('#tryIn').select();
    scrollTo(0, 0);
  }, 420);
}

function setMode(next) {
  mode = next;
  $('#mAnalyst').setAttribute('aria-pressed', mode === 'analyst');
  $('#mFan').setAttribute('aria-pressed', mode === 'fan');
  $('#rail').classList.toggle('off', mode === 'fan');
  document.body.classList.toggle('analyst', mode === 'analyst');
  $('#why').classList.toggle('hide', mode === 'fan');
  if (mode === 'fan') { showWhy = false; $('#sheet').classList.remove('up'); }
}

fetch('feed.json').then(r => r.json()).then(d => {
  FEED = d;
  cv = $('#cv'); ctx = cv.getContext('2d');
  layout(); addEventListener('resize', layout);
  makeGrain();
  buildTurf();
  buildShadow();
  buildPlayers();

  // Score comes from the stream as the clock runs, never from the final
  // tally: a console that reads 0-3 at kickoff has already told the
  // viewer how the match ends.
  $('#hTag').textContent = d.match.home.short; $('#hG').textContent = '0';
  $('#aTag').textContent = d.match.away.short; $('#aG').textContent = '0';

  renderRail();
  $('#track').innerHTML = `<div class="fill" id="fill"></div>` +
    FEED.moments.map(m => `<div class="pip" style="left:${m.minute * 60 / FULL * 100}%"></div>`).join('');

  $('#play').onclick = () => playing ? pause() : play();
  $('#why').onclick = () => {
    openTry(false); openAcc(false);
    showWhy = !showWhy;
    $('#sheet').classList.toggle('up', showWhy && idx >= 0);
    $('#lower').classList.toggle('hide', showWhy);
  };
  $('#spd').onclick = () => {
    SPEED = SPEEDS[(SPEEDS.indexOf(SPEED) + 1) % SPEEDS.length];
    TRAIL = SPEED * 2.4;
    $('#spd').innerHTML = SPEED + '&times;';
  };
  $('#wide').onclick = () => {
    wide = !wide;
    $('#wide').setAttribute('aria-pressed', wide);
    buildCam();
  };
  $('#snd').onclick = async () => {
    try {
      if (!AC) await initCrowd();
      if (sndOn) { await AC.suspend(); sndOn = false; }
      else { await AC.resume(); sndOn = true; }
    } catch (err) {
      // A failed fetch or decode must never wedge the button.
      sndOn = false; CROWD = null;
      if (AC) { try { AC.close(); } catch (e2) {} AC = null; }
    }
    $('#snd').setAttribute('aria-pressed', sndOn);
  };
  const sel = $('#lang');
  sel.innerHTML = (d.i18n?.languages ?? [{code: 'en', name: 'English'}])
    .map(l => `<option value="${l.code}">${l.name}</option>`).join('');
  sel.onchange = () => setLang(sel.value);
  $('#try').onclick = () => { openAcc(false); openTry(!$('#tryit').classList.contains('up')); };
  $('#accBtn').onclick = () => openAcc(!$('#acc').classList.contains('up'));
  $('#tryGo').onclick = runTry;
  $('#tryIn').onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); runTry(); }
    e.stopPropagation();   // Space must type, not toggle playback
  };
  $('#mAnalyst').onclick = () => setMode('analyst');
  $('#mFan').onclick = () => setMode('fan');
  $('#track').onclick = e => {
    pause();
    const r = $('#track').getBoundingClientRect();
    clock = (e.clientX - r.left) / r.width * FULL; sync();
  };
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Space' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'Escape' && $('#acc').classList.contains('up')) { openAcc(false); $('#accBtn').focus(); }
    // Call it from the keyboard: up for above his level, down for below.
    if ($('#lower').classList.contains('ask') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault(); answerCall(idx, e.key === 'ArrowUp' ? 'up' : 'down');
    }
  });
  // A phone has no room for the rail beside the pitch: open in Fan mode.
  setMode(matchMedia('(max-width: 760px)').matches ? 'fan' : 'analyst');
  setLang(d.i18n?.default ?? 'en');

  // Open ON the claim, not at kickoff. Every competitor's demo loads at
  // 0-0 with an empty insight panel; the one thing this project exists
  // to say should be on screen before anyone touches a control.
  const centre = d.window && d.window.centre_minute != null
    ? d.window.centre_minute : d.moments[0].minute;
  let open = 0, bestGap = 1e9;
  d.moments.forEach((m, i) => {
    const gap = Math.abs(m.minute - centre) + (m.diverges ? 0 : 6);
    if (gap < bestGap) { bestGap = gap; open = i; }
  });
  BALL = buildBallTrack();
  clock = bestOpening(d.moments[open].minute);
  { const edge = Math.max(11, RIG.span * .22), b0 = ballAt(clock);
    camX = Math.max(edge, Math.min(L - edge, b0.x));
    lookY = Math.max(16, Math.min(W - 16, b0.y)); }
  OPENER = open;
  loadCall(); applyAcc(); renderRail();
  sync(); showMoment(open);
  BOOTED = true; ANNOUNCED = open;
  // Azure voices exist only behind the local server, which holds the key.
  // On the static site this 404s and the browser voice is used.
  if (!/github\.io$/.test(location.hostname)) fetch('api/speech').then(r => r.ok ? r.json() : null).then(j => {
    AZURE = !!(j && j.azure);
    let saved = null; try { saved = localStorage.getItem('gp.acc'); } catch (e) {}
    if (AZURE && !saved) ACC.voice = 'azure';
    if ($('#acc').classList.contains('up')) renderAcc();
  }).catch(() => {});
  last = performance.now();
  requestAnimationFrame(frame);
}).catch(() => {
  document.body.innerHTML =
    '<div style="padding:40px;font:15px system-ui;color:#eef4fa">No feed. Run ' +
    '<code>python -m gegenpress feed</code>, then <code>python -m http.server -d docs 8000</code></div>';
});
</script>
</body>
