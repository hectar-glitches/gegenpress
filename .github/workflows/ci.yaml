name: ci
on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - run: pip install pytest
            - name: tests
              run: python -m pytest tests/ -q
            - name: realism report
              run: PYTHONPATH=src python -m gegenpress calibrate
            - name: signal report
              run: PYTHONPATH=src python -m gegenpress form
            