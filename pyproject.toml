[project]
name = "gegenpress"
version = "0.1.0"
description = "Synthetic football season and expected-vs-actual grounding for explainable match intelligence"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gegenpress = "gegenpress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gegenpress"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
