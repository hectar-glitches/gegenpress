[project]
name = "gegenpress"
version = "0.1.0"
description = "Synthetic football season and expected-vs-actual grounding for explainable match intelligence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The MCP server is the only thing here with a runtime dependency, so it
# is an extra rather than a requirement: the pipeline, the gate and the
# console all run on the standard library alone.
mcp = ["mcp>=1.0"]

[project.scripts]
gegenpress = "gegenpress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gegenpress"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
